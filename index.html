      await Sheet.close(); TxForm.open({ preset: { ...copy, type: st.type } });
    });
    form.querySelector('[data-goto]')?.addEventListener('click', async (e) => { const p = e.target.dataset.goto; await Sheet.close(); go(p); });
  },
  async save(form, st, editing, mode) {
    const d = formData(form), t = st.type;
    const amount = Money.parse(d.amount);
    if (t === 'adjust') { if (isNaN(amount) || amount === 0) return fieldError(form, 'amount', 'Enter the adjustment amount'); }
    else if (isNaN(amount) || amount <= 0) return fieldError(form, 'amount', 'Enter an amount greater than zero');
    if (!D.valid(d.date)) return fieldError(form, 'date', 'Enter a valid date');
    const tx = {
      id: st.v.id || uid(), type: t, date: d.date, amount, description: d.description || '', notes: d.notes || '',
      accountId: d.accountId || null, createdAt: st.v.createdAt || nowIso(), updatedAt: nowIso(),
    };
    if (st.v.recurringId) tx.recurringId = st.v.recurringId;
    if (!tx.accountId || !Acct.get(tx.accountId)) return fieldError(form, 'accountId', 'Choose an account');
    if (t === 'expense' || t === 'income') {
      if (!st.v.categoryId) return fieldError(form, 'categoryId', 'Choose a category');
      if (!tx.description) return fieldError(form, 'description', 'Enter a short description');
      tx.categoryId = st.v.categoryId; tx.subcategoryId = st.v.subcategoryId || null; tx.paymentMethod = d.paymentMethod || '';
      if (t === 'income') {
        const g = d.gross ? Money.parse(d.gross) : null, de = d.deductions ? Money.parse(d.deductions) : null;
        if (g != null && isNaN(g)) return fieldError(form, 'gross', 'Gross amount is not a valid number');
        if (de != null && isNaN(de)) return fieldError(form, 'deductions', 'Deductions is not a valid number');
        if (g != null) tx.gross = g; if (de != null) tx.deductions = de;
      }
    } else if (t === 'transfer') {
      if (!d.toAccountId) return fieldError(form, 'toAccountId', 'Choose the destination account');
      if (d.toAccountId === d.accountId) return fieldError(form, 'toAccountId', 'From and To accounts must be different');
      tx.toAccountId = d.toAccountId; if (!tx.description) tx.description = 'Transfer';
    } else if (t === 'saving' || t === 'investment') {
      if (d.toAccountId && d.toAccountId === d.accountId) return fieldError(form, 'toAccountId', 'From and Into accounts must be different');
      tx.toAccountId = d.toAccountId || null; tx.goalId = d.goalId || null;
      tx.categoryId = Cat.byKey('savings')?.id || null; tx.subcategoryId = st.v.subcategoryId || null;
      if (!tx.description) tx.description = (tx.goalId ? byId(S.goals, tx.goalId)?.name + ' — ' : '') + (t === 'saving' ? 'Savings contribution' : 'Investment contribution');
    } else if (t === 'loan_repayment' || t === 'loan_in') {
      if (!d.loanId) return fieldError(form, 'loanId', 'Register a loan first (More › Loans)');
      tx.loanId = d.loanId;
      const loan = byId(S.loans, d.loanId);
      if (t === 'loan_repayment') {
        let i = d.interest ? Money.parse(d.interest) : NaN, p = d.principal ? Money.parse(d.principal) : NaN;
        if (isNaN(i) && isNaN(p)) { p = amount; i = 0; } else if (isNaN(i)) i = amount - p; else if (isNaN(p)) p = amount - i;
        if (i < 0 || p < 0 || i + p !== amount) return fieldError(form, 'principal', 'Principal + interest must equal the total paid');
        tx.principal = p; tx.interest = i;
        tx.categoryId = Cat.byKey('finobl')?.id || null; tx.subcategoryId = Cat.byKey('interest')?.id || null;
        if (!tx.description) tx.description = `Loan repayment — ${loan?.name || ''}`;
      } else if (!tx.description) tx.description = `Loan received — ${loan?.name || ''}`;
    } else if (t === 'adjust') { if (!tx.description) tx.description = 'Balance adjustment'; }
    await Store.save('transactions', tx);
    requestPersistence();
    if (!editing && st.v.recurringId) { const r = byId(S.recurring, st.v.recurringId); if (r) await Recurring.advance(r); }
    if (mode === 'again') {
      toast(`Saved ${Money.fmt(amount)} — add the next one`);
      st.v = { date: tx.date, accountId: tx.accountId, paymentMethod: S.settings.defaultPaymentMethod || '' };
      form._render(); form.querySelector('[name=amount]')?.focus();
    } else {
      await Sheet.close();
      toast(editing ? 'Changes saved — reports updated' : `${TX_TYPES[t].short} of ${Money.fmt(amount)} saved`, 'ok');
    }
  },
};

const TX_GROUPS = { all: ['All', null], expense: ['Expenses', ['expense']], income: ['Income', ['income']], moves: ['Transfers & savings', ['transfer', 'saving', 'investment', 'adjust']], loans: ['Loans', ['loan_repayment', 'loan_in']] };
function filterTx() {
  const f = UI.txf, q = f.q.toLowerCase(), types = TX_GROUPS[f.group][1];
  let list = S.transactions.filter(t => {
    if (types && !types.includes(t.type)) return false;
    if (f.from && t.date < f.from) return false;
    if (f.to && t.date > f.to) return false;
    if (f.categoryId && t.categoryId !== f.categoryId && t.subcategoryId !== f.categoryId) return false;
    if (f.paymentMethod && (t.paymentMethod || '') !== f.paymentMethod) return false;
    if (f.accountId && t.accountId !== f.accountId && t.toAccountId !== f.accountId) return false;
    if (q) {
      const hay = `${t.description} ${t.notes || ''} ${Cat.full(t.categoryId, t.subcategoryId)} ${t.paymentMethod || ''} ${Money.toInput(t.amount)} ${Acct.name(t.accountId)}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const [k, dir] = f.sort.split('-'), m = dir === 'asc' ? 1 : -1;
  list.sort((a, b) => k === 'amount' ? m * (a.amount - b.amount) || b.date.localeCompare(a.date) : m * (a.date.localeCompare(b.date) || (a.createdAt || '').localeCompare(b.createdAt || '')));
  return list;
}
function txFilterCount() { const f = UI.txf; return [f.from || f.to, f.categoryId, f.paymentMethod, f.accountId].filter(Boolean).length; }

/** Let the user download or share a generated file. */
async function exportChooser(text, filename, mime, note = '') {
  const canShare = Files.canShare(filename, mime);
  const choice = await Dialog.show({ title: 'Export', message: `${filename}${note ? '\n' + note : ''}`, buttons: [{ label: 'Cancel', value: false }, ...(canShare ? [{ label: 'Share…', value: 'share' }] : []), { label: 'Save to phone', value: 'dl', primary: true }] });

function dashCharts() {
  const months = trendMonths(), labels = months.map(D.monthShort), tips = months.map(D.monthLabel);

  const per = Calc.summary(from, to);
  const perLabel = yearMode ? UI.month.slice(0, 4) : D.monthLabel(UI.month);
  const catItems = [...per.byCat.entries()].map(([id, v]) => ({ label: Cat.name(id), value: v }));
  const bud = yearMode ? Calc.budgetRows(months[0], months[11]) : Calc.budgetRows(UI.month, UI.month);
  // cumulative savings (all-time contributions up to each month end)
  const cum = months.map(m => sum(S.transactions.filter(t => (t.type === 'saving' || t.type === 'investment') && t.date <= D.end(m)), t => t.amount));
  return `<div class="charts">
    ${C.card('Income vs expenditure', Charts.bars(labels, [{ name: 'Income', cls: 's1', values: sums.map(x => x.income) }, { name: 'Expenditure', cls: 's2', values: sums.map(x => x.expenditure) }], { tipLabels: tips }))}
    ${C.card(`Expenditure by category · ${perLabel}`, Charts.share(catItems, per.expenditure))}
    ${C.card('Monthly expenditure trend', Charts.line(labels, [{ name: 'Expenditure', cls: 's2', values: sums.map(x => x.expenditure) }], { area: true, tipLabels: tips }))}
    ${C.card(`Budget vs actual · ${perLabel}`, Charts.budgetVsActual(bud.rows))}
    ${C.card('Savings accumulation', Charts.line(labels, [{ name: 'Cumulative savings & investments', cls: 's3', values: cum }], { area: true, tipLabels: tips, empty: 'No savings contributions recorded yet' }))}
    ${C.card('Cash flow trend (net)', Charts.bars(labels, [{ name: 'Net cash flow', cls: 's1', values: sums.map(x => x.netCashFlow) }], { signed: true, tipLabels: tips }))}
  </div>`;
}

        ${C.stat('Remaining', `<span class="${b.remaining < 0 ? 'neg' : ''}">${Money.fmt(b.remaining)}</span>`)}${C.stat('Utilisation', `${fmtPct(b.pct)}`, C.status(st))}</div>
        ${Charts.progress(b.pct, st.key)}${b.unbudgeted > 0 ? `<p class="muted small">Spending in categories without a budget: ${Money.fmt(b.unbudgeted)}</p>` : ''}</section>`
      : `<section class="card"><p>No budgets set for ${D.monthLabel(ym)}.</p><p class="muted small">Set a monthly amount per category or subcategory. Suggestions use your average spending over the previous ${S.settings.budgetSuggestMonths || 3} months.</p></section>`) +
    `<div class="btnrow"><button class="btn primary" data-act="bud-edit">${has ? 'Edit budgets' : 'Create budgets'}</button><button class="btn" data-act="bud-copy">Copy last month</button><button class="btn" data-act="bud-hist">History</button></div>
    <div class="legend-st"><span class="pill st-ok">Below 70% Normal</span><span class="pill st-near">70–89% Approaching</span><span class="pill st-warn">90–99% Warning</span><span class="pill st-over">100%+ Overspending</span></div>
    <section class="card">${rows || '<div class="empty">No spending or budgets this month</div>'}</section>`;
};

Actions['bud-edit'] = () => {
  const ym = UI.month, cur = Calc.budgetMap(ym), n = S.settings.budgetSuggestMonths || 3;
  const inp = (c, isSub) => {
    const sug = Calc.suggestion(c.id, ym, isSub);
    return `<div class="bed${isSub ? ' sub' : ''}"><span class="bed-l">${esc(c.name)}</span>
      ${C.moneyInput('b_' + c.id, cur.has(c.id) ? cur.get(c.id) : null, { placeholder: '—' })}
      ${sug > 0 ? `<button type="button" class="chip sm alt" data-sug="${c.id}" data-amt="${sug}" title="${n}-month average">Avg ${Money.short(sug)}</button>` : '<span class="chip-ph"></span>'}</div>`;
  };
  const body = `<form><p class="hint">Enter monthly budgets for ${D.monthLabel(ym)}. Leave blank for no budget. “Avg” = average actual spending over the previous ${n} months (rounded to MK 1,000). Nothing is saved until you tap Save.</p>
    <button type="button" class="btn sm" data-fillall>Fill empty fields with suggestions</button>
    ${Cat.tops('expense').map(top => `<div class="bed-group">${inp(top, false)}<details ${Cat.subs(top.id).some(s => cur.has(s.id)) ? 'open' : ''}><summary>Subcategory budgets</summary>${Cat.subs(top.id).map(s => inp(s, true)).join('')}</details></div>`).join('')}
    <div class="form-btns sticky"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save budgets</button></div></form>`;
  const root = Sheet.open({ title: `Budgets · ${D.monthLabel(ym)}`, body });
  const form = $('form', root);
  root.querySelectorAll('[data-sug]').forEach(b => b.onclick = () => { form.querySelector(`[name="b_${b.dataset.sug}"]`).value = Money.fmt(+b.dataset.amt, { symbol: false }); });
  root.querySelector('[data-fillall]').onclick = () => { root.querySelectorAll('[data-sug]').forEach(b => { const i = form.querySelector(`[name="b_${b.dataset.sug}"]`); if (!i.value) i.value = Money.fmt(+b.dataset.amt, { symbol: false }); }); toast('Suggestions filled in — review, then Save'); };
  form.onsubmit = async (e) => {
    e.preventDefault();
    const d = formData(form), puts = [], dels = [];
    for (const [k, v] of Object.entries(d)) {
      if (!k.startsWith('b_')) continue;
      const catId = k.slice(2), id = ym + '|' + catId;
      if (v === '') { if (cur.has(catId)) dels.push(id); continue; }
      const a = Money.parse(v); if (isNaN(a) || a < 0) return fieldError(form, k, 'Budget amounts must be positive numbers');
      puts.push({ id, month: ym, categoryId: catId, amount: a, updatedAt: nowIso() });
    }
    await Store.saveMany('budgets', puts);
    for (const id of dels) await Store.remove('budgets', id);
    await Sheet.close(); toast('Budgets saved', 'ok');
  };
};
Actions['bud-copy'] = async () => {
  const ym = UI.month, prev = D.addMonths(ym, -1), src = S.budgets.filter(b => b.month === prev);
  if (!src.length) return Dialog.alert(`There are no budgets in ${D.monthLabel(prev)} to copy.`);
  const existing = S.budgets.filter(b => b.month === ym).length;
  if (!(await Dialog.confirm(`Copy ${src.length} budget${src.length > 1 ? 's' : ''} from ${D.monthLabel(prev)} to ${D.monthLabel(ym)}?${existing ? ` Matching categories already budgeted in ${D.monthLabel(ym)} will be overwritten.` : ''}`, { ok: 'Copy budgets' }))) return;
  await Store.saveMany('budgets', src.map(b => ({ ...b, id: ym + '|' + b.categoryId, month: ym, updatedAt: nowIso() })));
  toast('Budgets copied', 'ok');
};
Actions['bud-hist'] = () => {
  const months = D.monthsInRange(D.addMonths(UI.month, -5), UI.month);
  const data = months.map(m => ({ m, b: Calc.budgetRows(m, m) }));
  const catIds = new Set(); data.forEach(({ b }) => b.rows.forEach(r => { if (r.hasBudget) catIds.add(r.cat.id); }));
  const cell = (r) => r && r.allocated != null ? `<td class="st-t st-${r.status.key}">${fmtPct(r.pct)}</td>` : '<td class="muted">—</td>';
  const body = `<h4>Monthly totals</h4><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Month</th><th>Budget</th><th>Actual</th><th>Used</th><th>Over</th></tr></thead><tbody>
    ${data.map(({ m, b }) => `<tr><td>${D.monthShortY(m)}</td><td>${Money.short(b.totalAlloc)}</td><td>${Money.short(b.totalActual)}</td>${b.totalAlloc ? `<td class="st-t st-${Calc.status(b.pct).key}">${fmtPct(b.pct)}</td>` : '<td class="muted">—</td>'}<td>${b.rows.filter(r => r.status.key === 'over' && !r.derived).length + sum(b.rows, r => r.subs.filter(x => x.status.key === 'over').length)}</td></tr>`).join('')}</tbody></table></div>
    <h4>Utilisation by category</h4><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Category</th>${months.map(m => `<th>${D.monthShort(m)}</th>`).join('')}</tr></thead><tbody>
    ${[...catIds].map(id => `<tr><td>${esc(Cat.name(id))}</td>${data.map(({ b }) => cell(b.rows.find(r => r.cat.id === id))).join('')}</tr>`).join('') || `<tr><td colspan="${months.length + 1}" class="muted">No budgets in this period</td></tr>`}</tbody></table></div>
    <p class="hint">Top-level categories only. Colours follow the warning levels.</p>`;
  Sheet.open({ title: 'Budget performance history', body, wide: true });
};

/* ================================ REPORTS ================================ */
function repRange() {
  const r = UI.rep;
  if (r.kind === 'month') return { from: D.start(r.ym), to: D.end(r.ym), label: D.monthLabel(r.ym), fromYm: r.ym, toYm: r.ym };
  if (r.kind === 'quarter') { const a = `${r.year}-${String((r.q - 1) * 3 + 1).padStart(2, '0')}`, b = D.addMonths(a, 2); return { from: D.start(a), to: D.end(b), label: `Q${r.q} ${r.year} (${D.monthShort(a)}–${D.monthShort(b)})`, fromYm: a, toYm: b }; }
  if (r.kind === 'year') return { from: `${r.year}-01-01`, to: `${r.year}-12-31`, label: `Year ${r.year}`, fromYm: `${r.year}-01`, toYm: `${r.year}-12` };
  const from = r.from <= r.to ? r.from : r.to, to = r.from <= r.to ? r.to : r.from;
  return { from, to, label: `${D.fmt(from)} – ${D.fmt(to)}`, fromYm: from.slice(0, 7), toYm: to.slice(0, 7), custom: true };
}
function prevRange(R) {
  const days = D.diffDays(R.from, R.to) + 1;
  if (!R.custom) { const n = D.monthsBetween(R.fromYm, R.toYm) + 1, a = D.addMonths(R.fromYm, -n), b = D.addMonths(R.toYm, -n); return { from: D.start(a), to: D.end(b) }; }
  return { from: D.addDays(R.from, -days), to: D.addDays(R.from, -1) };
}
const REPORT_SECTIONS = [['all', 'Full financial report'], ['summary', 'Summary'], ['income', 'Income statement'], ['expenditure', 'Expenditure report & category analysis'], ['cashflow', 'Cash flow statement'], ['budget', 'Budget performance'], ['savings', 'Savings report'], ['loans', 'Loan & liability report'], ['networth', 'Net worth statement']];

Views.reports = () => {
  const r = UI.rep, R = repRange();
  let picker = '';
  if (r.kind === 'month') picker = C.monthBar(r.ym, 'rep-nav');
  else if (r.kind === 'quarter' || r.kind === 'year') picker = `<div class="monthbar"><button class="icon-btn" data-act="rep-nav" data-d="-1">${I.left}</button><div class="mb-label">${esc(R.label)}</div><button class="icon-btn" data-act="rep-nav" data-d="1">${I.right}</button></div>`;
  else picker = `<div class="row2 pad">${C.field('From', `<input type="date" value="${r.from}" data-change="rep-from">`)}${C.field('To', `<input type="date" value="${r.to}" data-change="rep-to">`)}</div>`;
  return C.header('Reports') + `<div class="noprint">${C.seg('rk', [['month', 'Month'], ['quarter', 'Quarter'], ['year', 'Year'], ['custom', 'Custom']], r.kind, 'rep-kind')}${picker}
    <div class="rep-tools"><select data-change="rep-sec" aria-label="Report">${C.options(REPORT_SECTIONS, r.section)}</select>
      <button class="btn sm" data-act="rep-pdf">PDF</button><button class="btn sm" data-act="rep-csv">CSV</button></div></div>
    <article class="report" id="report">${buildReport(R, r.section)}</article>`;
};
Actions['rep-kind'] = (el) => { UI.rep.kind = el.dataset.v; rerender(); };
Actions['rep-nav'] = (el) => {
  const r = UI.rep, d = +el.dataset.d;
  if (r.kind === 'month') r.ym = d === 0 ? D.thisMonth() : D.addMonths(r.ym, d);
  else if (r.kind === 'quarter') { let q = r.q + d, y = r.year; if (q < 1) { q = 4; y--; } if (q > 4) { q = 1; y++; } r.q = q; r.year = y; }
  else if (r.kind === 'year') r.year += d;
  rerender();
};
Actions['rep-from'] = (el) => { UI.rep.from = el.value; rerender(); };
Actions['rep-to'] = (el) => { UI.rep.to = el.value; rerender(); };
Actions['rep-sec'] = (el) => { UI.rep.section = el.value; rerender(); };
Actions['rep-pdf'] = () => { toast('In the print screen choose “Save as PDF”'); setTimeout(() => window.print(), 400); };
Actions['rep-csv'] = async () => {
  const R = repRange(), rows = reportCsv(R);
  await exportChooser(Files.csv(rows), `PFM-report-${R.from}_to_${R.to}.csv`, 'text/csv', R.label);
};

function tbl(head, rows, { foot = null, cls = '' } = {}) {
  return `<div class="tbl-wrap"><table class="tbl ${cls}"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr${r.cls ? ` class="${r.cls}"` : ''}>${(r.cells || r).map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>${foot ? `<tfoot><tr>${foot.map(c => `<td>${c}</td>`).join('')}</tr></tfoot>` : ''}</table></div>`;
}
const M = (t) => Money.fmt(t);
function chg(cur, prev) { if (!prev) return '<span class="muted">—</span>'; const p = (cur - prev) / Math.abs(prev) * 100; return `<span class="${p > 0 ? 'up' : p < 0 ? 'down' : ''}">${p > 0 ? '+' : ''}${fmtPct(p)}</span>`; }

function buildReport(R, section) {
  const s = Calc.summary(R.from, R.to), P = prevRange(R), p = Calc.summary(P.from, P.to);
  const months = D.monthsInRange(R.fromYm, R.toYm), multi = months.length > 1 && !R.custom;
  const want = (k) => section === 'all' || section === k;
  let h = `<header class="rep-h"><h2>${esc(REPORT_SECTIONS.find(x => x[0] === section)[1])}</h2><p>${esc(R.label)} · All amounts in ${esc(S.settings.currencyCode || 'MWK')} · Generated ${D.fmt(D.today())}</p></header>`;
  if (!s.txCount && !['networth', 'loans', 'savings'].includes(section)) h += `<p class="muted">No transactions recorded in this period.</p>`;

  if (want('summary')) {
    if (!R.custom && months.length === 1) { const ins = Insights.forMonth(R.fromYm); if (s.txCount) h += `<section><h3>Key insights</h3><ul class="insights">${ins.map(i => `<li class="in-${i.level}">${esc(i.text)}</li>`).join('')}</ul></section>`; }
    h += `<section><h3>Summary</h3>${tbl(['', 'This period', 'Previous', 'Change'], [
      ['Total income', M(s.income), M(p.income), chg(s.income, p.income)],
      ['Total expenditure', M(s.expenditure), M(p.expenditure), chg(s.expenditure, p.expenditure)],
      ['Net cash flow', M(s.netCashFlow), M(p.netCashFlow), ''],
      ['Savings contributions', M(s.savings), M(p.savings), chg(s.savings, p.savings)],
      ['Investment contributions', M(s.investments), M(p.investments), chg(s.investments, p.investments)],
      ['Loan principal repaid', M(s.principal), M(p.principal), ''],
      ['Savings rate', fmtPct(s.savingsRate), fmtPct(p.savingsRate), ''],
      ['Closing cash balance', M(s.closingCash), M(p.closingCash), ''],
    ])}</section>`;
    if (multi) {
      const ms = months.map(m => ({ m, x: Calc.month(m) }));
      h += `<section><h3>${months.length === 12 ? 'Annual' : 'Quarterly'} breakdown by month</h3>
        ${Charts.bars(months.map(D.monthShort), [{ name: 'Income', cls: 's1', values: ms.map(o => o.x.income) }, { name: 'Expenditure', cls: 's2', values: ms.map(o => o.x.expenditure) }], { tipLabels: months.map(D.monthLabel) })}
        ${tbl(['Month', 'Income', 'Expenditure', 'Net', 'Saved', 'Rate'], ms.map(({ m, x }) => [D.monthShortY(m), M(x.income), M(x.expenditure), `<span class="${x.netCashFlow < 0 ? 'neg' : ''}">${M(x.netCashFlow)}</span>`, M(x.savingsTotal), fmtPct(x.savingsRate)]),
        { foot: ['Total', M(s.income), M(s.expenditure), M(s.netCashFlow), M(s.savingsTotal), fmtPct(s.savingsRate)] })}</section>`;
    }
  }
  if (want('income')) {
    const inc = [...s.incomeByCat.entries()].sort((a, b) => b[1] - a[1]);
    const exp = [...s.byCat.entries()].sort((a, b) => b[1] - a[1]);
    const gross = sum(S.transactions.filter(t => t.type === 'income' && t.date >= R.from && t.date <= R.to && t.gross != null), t => t.gross);
    const ded = sum(S.transactions.filter(t => t.type === 'income' && t.date >= R.from && t.date <= R.to && t.deductions != null), t => t.deductions);
    h += `<section><h3>Income statement</h3>${tbl(['Item', 'Amount', '%'], [
      { cls: 'grp', cells: ['<b>Income</b>', '', ''] },
      ...inc.map(([id, v]) => [esc(Cat.name(id)), M(v), fmtPct(v / s.income * 100)]),
      { cls: 'tot', cells: ['Total income (net received)', M(s.income), '100%'] },
      { cls: 'grp', cells: ['<b>Expenditure</b>', '', ''] },
      ...exp.map(([id, v]) => [esc(Cat.name(id)), M(v), fmtPct(pct(v, s.income))]),
      { cls: 'tot', cells: ['Total expenditure', M(s.expenditure), fmtPct(pct(s.expenditure, s.income))] },
      { cls: 'tot big', cells: [s.netCashFlow >= 0 ? 'Surplus (net cash flow)' : 'Deficit (net cash flow)', M(s.netCashFlow), fmtPct(pct(s.netCashFlow, s.income))] },
      { cls: 'grp', cells: ['<b>Allocated from surplus</b>', '', ''] },
      ['Savings contributions', M(s.savings), fmtPct(pct(s.savings, s.income))],
      ['Investment contributions', M(s.investments), fmtPct(pct(s.investments, s.income))],
      ['Loan principal repaid', M(s.principal), fmtPct(pct(s.principal, s.income))],
    ])}${gross ? `<p class="muted small">Where recorded: gross income ${M(gross)}, deductions ${M(ded)}.</p>` : ''}
    <p class="muted small">Expenditure includes loan interest (${M(s.interest)}). Loan principal, savings, investments and transfers are not expenditure.</p></section>`;
  }
  if (want('expenditure')) {
    const cats = [...s.byCat.entries()].sort((a, b) => b[1] - a[1]);
    let rows = [];
    for (const [id, v] of cats) {
      rows.push({ cls: 'grp', cells: [`<b>${esc(Cat.name(id))}</b>`, `<b>${M(v)}</b>`, fmtPct(v / s.expenditure * 100), chg(v, p.byCat.get(id) || 0)] });
      const subs = Cat.subs(id, true).map(c => [c, s.bySub.get(c.id) || 0]).filter(([, x]) => x > 0).sort((a, b) => b[1] - a[1]);
      const subTotal = sum(subs, x => x[1]);
      subs.forEach(([c, x]) => rows.push(['&nbsp;&nbsp;' + esc(c.name), M(x), fmtPct(x / s.expenditure * 100), chg(x, p.bySub.get(c.id) || 0)]));
      if (subs.length && v - subTotal > 0) rows.push(['&nbsp;&nbsp;<i>No subcategory</i>', M(v - subTotal), fmtPct((v - subTotal) / s.expenditure * 100), '']);
    }
    const largest = S.transactions.filter(t => t.date >= R.from && t.date <= R.to && Calc.expenseLines(t).length).map(t => ({ t, a: sum(Calc.expenseLines(t), l => l.amt) })).sort((a, b) => b.a - a.a).slice(0, 10);
    const pm = [...s.payMethods.entries()].sort((a, b) => b[1] - a[1]);
    h += `<section><h3>Expenditure by category</h3>${Charts.share(cats.map(([id, v]) => ({ label: Cat.name(id), value: v })), s.expenditure)}
      ${tbl(['Category', 'Amount', 'Share', 'vs prev.'], rows, { foot: ['Total expenditure', M(s.expenditure), '100%', chg(s.expenditure, p.expenditure)] })}</section>
      ${largest.length ? `<section><h3>Largest expenses</h3>${tbl(['Date', 'Description', 'Category', 'Amount'], largest.map(({ t, a }) => [D.fmt(t.date), esc(t.description), esc(Cat.full(t.categoryId, t.subcategoryId)), M(a)]))}</section>` : ''}
      ${pm.length ? `<section><h3>Spending by payment method</h3>${tbl(['Payment method', 'Amount', 'Share'], pm.map(([k, v]) => [esc(k), M(v), fmtPct(v / s.consumption * 100)]))}</section>` : ''}`;
  }
  if (want('cashflow')) {
    h += `<section><h3>Cash flow statement</h3>${tbl(['', 'Amount'], [
      { cls: 'tot', cells: ['Opening cash balance', M(s.openingCash)] },
      ['Add: income received', M(s.income)],
      ['Less: consumption expenditure', M(-s.consumption)],
      ['Less: loan interest paid', M(-s.interest)],
      { cls: 'tot', cells: ['Net cash flow from income & expenditure', M(s.netCashFlow)] },
      ['Less: savings contributions', M(-s.savings)],
      ['Less: investment contributions', M(-s.investments)],
      ['Less: loan principal repaid', M(-s.principal)],
      ['Other movements (transfers with savings/investment accounts, loans received, adjustments)', M(s.otherMovements)],
      { cls: 'tot big', cells: ['Closing cash balance', M(s.closingCash)] },
    ])}<p class="muted small">Cash = cash, bank current and mobile money accounts. Transfers between these accounts net to zero.</p></section>`;
  }
  if (want('budget')) {
    const b = Calc.budgetRows(R.fromYm, R.toYm);
    const rows = [];
    b.rows.filter(r => r.hasBudget || r.actual).forEach(r => {
      rows.push({ cls: 'grp', cells: [`<b>${esc(r.cat.name)}</b>`, r.allocated != null ? M(r.allocated) : '—', M(r.actual), r.remaining != null ? M(r.remaining) : '—', r.allocated != null ? `<span class="st-t st-${r.status.key}">${fmtPct(r.pct)}</span>` : '—'] });
      r.subs.forEach(x => rows.push(['&nbsp;&nbsp;' + esc(x.cat.name), M(x.allocated), M(x.actual), M(x.remaining), `<span class="st-t st-${x.status.key}">${fmtPct(x.pct)}</span>`]));
    });
    h += `<section><h3>Budget performance${b.months > 1 ? ` (${b.months} months combined)` : ''}</h3>${R.custom ? '<p class="muted small">Custom range: budgets for every month the range touches are included in full.</p>' : ''}
      ${b.totalAlloc ? tbl(['Category', 'Allocated', 'Actual', 'Remaining', 'Used'], rows, { foot: ['Total (budgeted categories)', M(b.totalAlloc), M(b.totalActual), M(b.remaining), fmtPct(b.pct)] }) : '<p class="muted">No budgets set for this period.</p>'}</section>`;
  }
  if (want('savings')) {
    const goals = S.goals.filter(g => !g.archived || Calc.goalContrib(g, R.from, R.to));
    const bySub = [...s.savingsBySub.entries()].sort((a, b) => b[1] - a[1]);
    h += `<section><h3>Savings report</h3>${tbl(['', 'Amount'], [['Savings contributions', M(s.savings)], ['Investment contributions', M(s.investments)], { cls: 'tot', cells: ['Total saved & invested', M(s.savingsTotal)] }, ['Savings rate (of income)', fmtPct(s.savingsRate)], ['Unspent cash (net cash flow less savings, investments and principal)', M(s.netCashFlow - s.savingsTotal - s.principal)]])}
      ${bySub.length ? tbl(['Type', 'Amount'], bySub.map(([id, v]) => [esc(id === 'none' ? 'Unspecified' : Cat.name(id)), M(v)])) : ''}
      ${goals.length ? `<h4>Savings goals</h4>${tbl(['Goal', 'Saved', 'Target', 'Progress', 'This period'], goals.map(g => { const sv = Calc.goalSaved(g, R.to); return [esc(g.name), M(sv), M(g.target), fmtPct(pct(sv, g.target)), M(Calc.goalContrib(g, R.from, R.to))]; }))}` : ''}</section>`;
  }
  if (want('loans')) {
    const loans = S.loans.filter(l => !l.archived || Calc.loanOutstanding(l, D.addDays(R.from, -1)) || Calc.loanInterestPaid(l, R.from, R.to));
    h += `<section><h3>Loan & liability report</h3>${loans.length ? tbl(['Loan', 'Opening', 'Principal paid', 'Interest paid', 'Closing'], loans.map(l => {
      const o = Calc.loanOutstanding(l, D.addDays(R.from, -1)), c = Calc.loanOutstanding(l, R.to);
      return [esc(l.name), M(o), M(Calc.loanPrincipalPaid(l, R.to) - Calc.loanPrincipalPaid(l, D.addDays(R.from, -1))), M(Calc.loanInterestPaid(l, R.from, R.to)), M(c)];
    }), { foot: ['Total', M(Calc.liabilities(D.addDays(R.from, -1))), M(s.principal), M(s.interest), M(Calc.liabilities(R.to))] }) + `<p class="muted small">Current scheduled repayments: ${M(Calc.monthlyDebtObligation())} per month.</p>` : '<p class="muted">No loans registered.</p>'}</section>`;
  }
  if (want('networth')) {
    const n = Calc.netWorth(R.to), n0 = Calc.netWorth(D.addDays(R.from, -1));

function reportCsv(R) {
  const s = Calc.summary(R.from, R.to), rows = [['Personal Finance Manager report', R.label], ['Period', R.from, R.to], ['Currency', S.settings.currencyCode || 'MWK'], [], ['Section', 'Item', 'Amount']];
  const add = (sec, item, v) => rows.push([sec, item, Money.csv(v)]);

  add('Summary', 'Savings contributions', s.savings); add('Summary', 'Investment contributions', s.investments); add('Summary', 'Loan principal repaid', s.principal);
  add('Summary', 'Loan interest paid', s.interest); rows.push(['Summary', 'Savings rate %', s.savingsRate == null ? '' : s.savingsRate.toFixed(1)]);
  add('Cash flow', 'Opening cash balance', s.openingCash); add('Cash flow', 'Other movements', s.otherMovements); add('Cash flow', 'Closing cash balance', s.closingCash);
  for (const [id, v] of s.incomeByCat) add('Income by category', Cat.name(id), v);
  for (const [id, v] of [...s.byCat.entries()].sort((a, b) => b[1] - a[1])) add('Expenditure by category', Cat.name(id), v);
  for (const [id, v] of [...s.bySub.entries()].sort((a, b) => b[1] - a[1])) add('Expenditure by subcategory', Cat.full(Cat.get(id)?.parentId, id), v);
  const b = Calc.budgetRows(R.fromYm, R.toYm);
  b.rows.filter(r => r.hasBudget).forEach(r => { rows.push(['Budget', r.cat.name, Money.csv(r.allocated), Money.csv(r.actual), r.pct == null ? '' : r.pct.toFixed(1) + '%']); r.subs.forEach(x => rows.push(['Budget', Cat.full(r.cat.id, x.cat.id), Money.csv(x.allocated), Money.csv(x.actual), x.pct.toFixed(1) + '%'])); });
  if (D.monthsBetween(R.fromYm, R.toYm) > 0) D.monthsInRange(R.fromYm, R.toYm).forEach(m => { const x = Calc.month(m); rows.push(['Monthly', m, Money.csv(x.income), Money.csv(x.expenditure), Money.csv(x.netCashFlow), Money.csv(x.savingsTotal)]); });
  const n = Calc.netWorth(R.to);
  add('Net worth', 'Liquid assets', n.liquid); add('Net worth', 'Non-liquid assets', n.nonLiquid); add('Net worth', 'Liabilities', n.liabilities); add('Net worth', 'Net worth', n.netWorth);
  return rows;
}

More.networth = () => {
  const t = D.today(), n = Calc.netWorth(t);
  const first = Calc.firstDataMonth(), end = D.thisMonth(), start = D.addMonths(end, -11) > first ? D.addMonths(end, -11) : first;
  const months = D.monthsInRange(start, end), hist = months.map(m => Calc.netWorth(m === end ? t : D.end(m)));
  const row = (name, sub, v, act = '') => `<${act ? 'button' : 'div'} class="li" ${act}><div class="li-main"><b>${esc(name)}</b><span class="muted">${esc(sub)}</span></div><div class="li-end"><b>${Money.fmt(v)}</b></div></${act ? 'button' : 'div'}>`;
  return C.header('Assets & net worth', { back: 'more' }) +
    `<section class="card"><div class="stats">${C.stat('Net worth', Money.fmt(n.netWorth), 'Total assets − total liabilities', 'hero')}${C.stat('Liquid assets', Money.fmt(n.liquid))}${C.stat('Non-liquid assets', Money.fmt(n.nonLiquid), 'Estimated — not available cash')}${C.stat('Liabilities', Money.fmt(n.liabilities))}</div></section>` +
    C.card('Net worth history', Charts.line(months.map(D.monthShort), [{ name: 'Net worth', cls: 's1', values: hist.map(h => h.netWorth) }], { tipLabels: months.map(D.monthLabel) })) +
    C.card('Accounts (from your transactions)', `<div class="list">${n.accounts.filter(r => !r.a.archived || r.value).map(r => row(r.a.name, `${ACCOUNT_TYPES[r.a.type].label} · ${r.liquid ? 'liquid' : 'non-liquid'}`, r.value, `data-act="go" data-to="more/accounts"`)).join('')}</div>`) +
    C.card('Other assets (your valuations)', `<div class="list">${S.assets.filter(x => !x.archived).map(x => { const v = S.valuations.filter(y => y.assetId === x.id).sort((a, b) => b.date.localeCompare(a.date))[0]; return row(x.name, `${ASSET_TYPES[x.type] || ''} · ${x.liquid ? 'liquid' : 'non-liquid'}${v ? ' · valued ' + D.fmt(v.date) : ''}`, Calc.assetValue(x), `data-act="asset-edit" data-id="${x.id}"`); }).join('') || '<div class="empty">Add vehicles, land, property or other valuable assets.</div>'}</div>
      <button class="btn wide" data-act="asset-edit">Add asset</button>`) +
    C.card('Liabilities', `<div class="list">${n.loans.map(r => row(r.l.name, LOAN_TYPES[r.l.type] || '', r.value, `data-act="go" data-to="more/loans"`)).join('') || '<div class="empty">No liabilities</div>'}</div>`);
};
Actions['asset-edit'] = (el) => {
  const x = byId(S.assets, el.dataset.id), vals = x ? S.valuations.filter(v => v.assetId === x.id).sort((a, b) => b.date.localeCompare(a.date)) : [];
  const root = Sheet.open({ title: x ? x.name : 'Add asset', body: `<form>
    ${C.field('Asset name', `<input name="name" required maxlength="60" value="${esc(x?.name || '')}" placeholder="e.g. Toyota Fortuner, Plot in Area 47">`)}
    ${C.field('Type', `<select name="type">${C.options(Object.entries(ASSET_TYPES), x?.type || 'vehicle')}</select>`)}
    <label class="check"><input type="checkbox" name="liquid" ${x?.liquid ? 'checked' : ''}> Liquid (can be turned into cash quickly)</label>
    <h4>${x ? 'Record a new valuation' : 'Current estimated value'}</h4>
    <div class="row2">${C.field('Value', C.moneyInput('value', null, { required: !x }))}${C.field('Valuation date', `<input type="date" name="vdate" value="${D.today()}">`)}</div>
    ${vals.length ? `<h4>Valuation history</h4><div class="list">${vals.map(v => `<div class="li"><div class="li-main">${D.fmt(v.date)}</div><div class="li-end">${Money.fmt(v.value)} <button type="button" class="btn-link" data-delval="${v.id}">Remove</button></div></div>`).join('')}</div>` : ''}
    <div class="form-btns">${x ? `<button type="button" class="btn danger-o" data-arch>${x.archived ? 'Unarchive' : 'Archive (sold/disposed)'}</button>` : ''}<button class="btn primary">Save</button></div></form>` });
  const form = $('form', root);
  form.onsubmit = async (e) => {
    e.preventDefault(); const d = formData(form);
    if (!d.name) return fieldError(form, 'name', 'Enter a name');
    let v = null; if (d.value) { v = Money.parse(d.value); if (isNaN(v) || v < 0) return fieldError(form, 'value', 'Enter a valid value'); }
    else if (!x) return fieldError(form, 'value', 'Enter the current estimated value');
    if (v != null && !D.valid(d.vdate)) return fieldError(form, 'vdate', 'Enter the valuation date');
    const obj = { ...(x || { id: uid(), createdAt: nowIso(), archived: false }), name: d.name, type: d.type, liquid: !!d.liquid, updatedAt: nowIso() };
    await Store.save('assets', obj);
    if (v != null) await Store.save('valuations', { id: uid(), assetId: obj.id, date: d.vdate, value: v, createdAt: nowIso() });
    await Sheet.close(); toast('Asset saved', 'ok');
  };
  root.querySelectorAll('[data-delval]').forEach(b => b.onclick = async () => { if (await Dialog.confirm('Remove this valuation?', { ok: 'Remove', danger: true })) { await Store.remove('valuations', b.dataset.delval); b.closest('.li').remove(); } });
  root.querySelector('[data-arch]')?.addEventListener('click', async () => {
    if (!x.archived && !(await Dialog.confirm('Archive this asset? Record a final valuation of 0 first if it was sold, so net worth no longer includes it.', { ok: 'Archive' }))) return;
    await Store.save('assets', { ...x, archived: !x.archived }); await Sheet.close();
  });
};

/* ------------------------------ recurring ------------------------------ */
More.recurring = () => {
  const t = D.today(), up = Recurring.dueBetween('0000-01-01', D.addDays(t, 30));
  const list = [...S.recurring].sort((a, b) => (a.active === false) - (b.active === false) || (a.nextDue || '').localeCompare(b.nextDue || ''));
  return C.header('Recurring', { back: 'more' }) +
    `<p class="hint pad">Recurring items are reminders. They are <b>never recorded automatically</b>. A transaction is created only when you confirm it was paid or received.</p>` +
    C.card('Due in the next 30 days', up.length ? `<div class="list">${up.map(({ r, date }) => `<div class="li"><div class="li-main"><b>${esc(r.description)}</b><span class="muted">${date < t ? '<span class="neg">Overdue</span> · ' : ''}${D.pretty(date)} · ${Cat.full(r.categoryId, r.subcategoryId)}</span></div>
      <div class="li-end"><span>${Money.fmt(r.amount)}</span>${date === r.nextDue ? `<span class="btnrow tight"><button class="btn sm" data-act="rec-skip" data-id="${r.id}">Skip</button><button class="btn sm primary" data-act="rec-pay" data-id="${r.id}">${r.type === 'income' ? 'Received' : 'Paid'}</button></span>` : '<span class="muted small">later</span>'}</div></div>`).join('')}</div>
      <div class="kv"><span>Total due (expenses)</span><b>${Money.fmt(sum(up.filter(x => x.r.type !== 'income'), x => x.r.amount))}</b></div>` : '<div class="empty">Nothing due</div>') +
    C.card('All recurring items', list.length ? `<div class="list">${list.map(r => `<button class="li" data-act="rec-edit" data-id="${r.id}"><div class="li-main"><b>${esc(r.description)}${r.active === false ? ' <span class="pill">Paused</span>' : ''}</b><span class="muted">${r.type === 'income' ? 'Income' : 'Expense'} · ${FREQ[r.frequency]} · next ${D.fmt(r.nextDue)}</span></div><div class="li-end">${Money.fmt(r.amount)}</div></button>`).join('')}</div>` : '<div class="empty">None yet — add rent, school fees, insurance, internet, subscriptions, salary…</div>') +
    `<button class="btn wide primary" data-act="rec-edit">Add recurring item</button>`;
};
Actions['rec-skip'] = async (el) => { const r = byId(S.recurring, el.dataset.id); if (r && await Dialog.confirm(`Skip the ${D.fmt(r.nextDue)} occurrence of “${r.description}”? Nothing will be recorded.`, { ok: 'Skip' })) { await Recurring.advance(r); toast('Skipped'); } };
Actions['rec-edit'] = (el) => {
  const r = byId(S.recurring, el.dataset.id), st = { type: r?.type || 'expense', categoryId: r?.categoryId || null, subcategoryId: r?.subcategoryId || null };
  const root = Sheet.open({ title: r ? 'Edit recurring item' : 'Add recurring item', body: `<form></form>` });
  const form = $('form', root);
  const render = (keep = {}) => {
    form.innerHTML = `${C.seg('rt', [['expense', 'Expense'], ['income', 'Income']], st.type, 'x')}
      ${C.field('Description', `<input name="description" required maxlength="80" value="${esc(keep.description ?? r?.description ?? '')}" placeholder="e.g. House rent">`)}
      ${C.field('Amount', C.moneyInput('amount', keep.amount ?? r?.amount, { required: true }))}
      <div class="field"><span class="fl">Category</span>${TxForm.catChips(st.type, st.categoryId, st.subcategoryId)}</div>
      <div class="row2">${C.field('Frequency', `<select name="frequency">${C.options(Object.entries(FREQ), keep.frequency || r?.frequency || 'monthly')}</select>`)}${C.field('Next due date', `<input type="date" name="nextDue" value="${keep.nextDue || r?.nextDue || D.today()}" required>`)}</div>
      <div class="row2">${C.field('Account', `<select name="accountId">${C.acctOptions(keep.accountId || r?.accountId || S.settings.defaultAccountId)}</select>`)}${C.field('Payment method', `<select name="paymentMethod">${C.options((S.settings.paymentMethods || []).map(p => [p, p]), keep.paymentMethod ?? r?.paymentMethod ?? '', { blank: '—' })}</select>`)}</div>
      ${r ? `<label class="check"><input type="checkbox" name="paused" ${r.active === false ? 'checked' : ''}> Paused</label>` : ''}
      <div class="form-btns">${r ? '<button type="button" class="btn danger-o" data-del>Delete</button>' : ''}<button class="btn primary">Save</button></div>`;
    form.querySelectorAll('.seg button').forEach(b => b.onclick = (e) => { e.preventDefault(); const k = formData(form); k.amount = Money.parse(k.amount); st.type = b.dataset.v; st.categoryId = st.subcategoryId = null; render(k); });
    form.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { const k = formData(form); k.amount = Money.parse(k.amount); st.categoryId = b.dataset.cat; st.subcategoryId = null; render(k); });
    form.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => { const k = formData(form); k.amount = Money.parse(k.amount); st.subcategoryId = st.subcategoryId === b.dataset.sub ? null : b.dataset.sub; render(k); });
    form.querySelector('[data-del]')?.addEventListener('click', async () => { if (await Dialog.confirm(`Delete “${r.description}”? Past transactions are not affected.`, { ok: 'Delete', danger: true })) { await Store.remove('recurring', r.id); await Sheet.close(); } });
  };
  render();
  form.onsubmit = async (e) => {
    e.preventDefault(); const d = formData(form), amount = Money.parse(d.amount);
    if (!d.description) return fieldError(form, 'description', 'Enter a description');
    if (isNaN(amount) || amount <= 0) return fieldError(form, 'amount', 'Enter an amount');
    if (!st.categoryId) return fieldError(form, 'categoryId', 'Choose a category');
    if (!D.valid(d.nextDue)) return fieldError(form, 'nextDue', 'Enter the next due date');
    await Store.save('recurring', { ...(r || { id: uid(), createdAt: nowIso() }), type: st.type, description: d.description, amount, categoryId: st.categoryId, subcategoryId: st.subcategoryId, frequency: d.frequency, nextDue: d.nextDue, anchorDay: +d.nextDue.slice(8, 10), accountId: d.accountId, paymentMethod: d.paymentMethod || '', active: !d.paused, updatedAt: nowIso() });
    await Sheet.close(); toast('Saved', 'ok');
  };
};

/* --------------------------- monthly closing --------------------------- */
More.closing = () => {
  const ym = UI.month, c = Calc.closing(ym), p = Calc.closing(D.addMonths(ym, -1)), rec = byId(S.closes.map(x => ({ ...x, id: x.month })), ym);
  const lines = [['Opening cash balance', 'opening'], ['Total income', 'income'], ['Total expenditure', 'expenditure'], ['Savings contributions', 'savings'], ['Investment contributions', 'investments'], ['Loan principal repayments', 'principal'], ['Interest paid (incl. in expenditure)', 'interest'], ['Other movements', 'other'], ['Closing cash balance', 'closing']];
  let changed = [];
  if (rec?.snapshot) changed = lines.filter(([, k]) => rec.snapshot[k] !== undefined && rec.snapshot[k] !== c[k]).map(([l]) => l);
  return C.header('Monthly closing', { back: 'more' }) + C.monthBar(ym) +
    `<section class="card"><div class="card-h"><h3>Financial statement · ${D.monthLabel(ym)}</h3>${rec ? `<span class="pill st-ok">Closed ${D.fmt(rec.closedAt.slice(0, 10))}</span>` : '<span class="pill">Open</span>'}</div>
    ${tbl(['', D.monthShort(ym), D.monthShort(D.addMonths(ym, -1)), 'Change'], lines.map(([l, k]) => ({ cls: k === 'closing' || k === 'opening' ? 'tot' : '', cells: [l, Money.fmt(c[k]), Money.fmt(p[k]), k === 'other' || k === 'opening' ? '' : chg(c[k], p[k])] })))}
    <h4>Budget performance</h4>${c.budgetAlloc ? `<div class="kv"><span>Spent vs budget</span><b>${Money.fmt(c.budgetActual)} / ${Money.fmt(c.budgetAlloc)} (${fmtPct(c.budgetPct)})</b></div><div class="kv"><span>Budgets overspent</span><b class="${c.overCount ? 'neg' : ''}">${c.overCount}</b></div>` : '<p class="muted">No budgets set.</p>'}
    <h4>Outstanding financial commitments</h4>
    <div class="kv"><span>Loans outstanding at month end</span><b>${Money.fmt(c.liabilities)}</b></div>
    <div class="kv"><span>Scheduled loan repayments per month</span><b>${Money.fmt(c.monthlyDebt)}</b></div>
    <div class="kv"><span>Recurring expenses due next month</span><b>${Money.fmt(sum(c.upcoming.filter(x => x.r.type !== 'income'), x => x.r.amount))} (${c.upcoming.filter(x => x.r.type !== 'income').length})</b></div>
    ${changed.length ? `<p class="banner warn small">Corrections since closing changed: ${esc(changed.join(', '))}. Figures shown are recalculated from your current records.</p>` : ''}
    <div class="btnrow">${rec ? `<button class="btn" data-act="close-month" data-v="reopen">Reopen month</button><button class="btn" data-act="close-month" data-v="close">Re-confirm closing</button>` : `<button class="btn primary" data-act="close-month" data-v="close">Mark ${D.monthShort(ym)} as reviewed & closed</button>`}<button class="btn" data-act="go" data-to="reports">Full report</button></div>
    <p class="hint">Closing a month records that you reviewed it. You can still correct its transactions; all reports recalculate automatically.</p></section>
    ${S.closes.length ? C.card('Closed months', `<div class="list">${[...S.closes].sort((a, b) => b.month.localeCompare(a.month)).map(x => `<div class="li"><div class="li-main">${D.monthLabel(x.month)}</div><div class="li-end muted small">closed ${D.fmt(x.closedAt.slice(0, 10))}</div></div>`).join('')}</div>`) : ''}`;
};
Actions['close-month'] = async (el) => {
  const ym = UI.month;
  if (el.dataset.v === 'reopen') { await Store.remove('closes', ym); return toast('Month reopened'); }
  if (ym > D.thisMonth() || (ym === D.thisMonth() && !(await Dialog.confirm(`${D.monthLabel(ym)} has not ended yet. Close it anyway?`)))) { if (ym > D.thisMonth()) toast('You cannot close a future month', 'err'); return; }
  const c = Calc.closing(ym), snapshot = {}; ['opening', 'income', 'expenditure', 'savings', 'investments', 'principal', 'interest', 'other', 'closing'].forEach(k => snapshot[k] = c[k]);
  await Store.save('closes', { month: ym, closedAt: nowIso(), snapshot });
  toast(`${D.monthLabel(ym)} closed`, 'ok');
};

/* ------------------------------ categories ------------------------------ */
More.categories = () => {
  const k = UI.catKind;
  const tops = Cat.tops(k, true);
  return C.header('Categories', { back: 'more' }) + C.seg('ck', [['expense', 'Expense'], ['income', 'Income'], ['savings', 'Savings']], k, 'cat-kind') +
    tops.map(t => `<section class="card cat-card${t.archived ? ' archived' : ''}"><div class="card-h"><h3>${esc(t.name)}${t.archived ? ' <span class="pill">Archived</span>' : ''}</h3><button class="btn-link" data-act="cat-edit" data-id="${t.id}">Edit</button></div>
      ${k !== 'income' ? `<div class="chips">${Cat.subs(t.id, true).map(s => `<button class="chip sm ${s.archived ? 'arch' : ''}" data-act="cat-edit" data-id="${s.id}">${esc(s.name)}</button>`).join('')}<button class="chip sm alt" data-act="cat-add" data-parent="${t.id}">+ Subcategory</button></div>` : ''}</section>`).join('') +
    `<button class="btn wide primary" data-act="cat-add">Add ${k} category</button><p class="hint pad">Categories that already have transactions are archived rather than deleted, so your history and reports stay intact.</p>`;
};
Actions['cat-kind'] = (el) => { UI.catKind = el.dataset.v; rerender(); };
Actions['cat-add'] = async (el) => {
  const parent = el.dataset.parent ? Cat.get(el.dataset.parent) : null;
  const name = await Dialog.prompt(parent ? `New subcategory under “${parent.name}”` : `New ${UI.catKind} category`, { title: 'Add category', ok: 'Add' });
  if (!name || !name.trim()) return;
  const siblings = parent ? Cat.subs(parent.id, true) : Cat.tops(UI.catKind, true);
  if (siblings.some(s => s.name.toLowerCase() === name.trim().toLowerCase())) return toast('That name already exists', 'err');
  await Store.save('categories', { id: uid(), name: name.trim(), kind: parent ? parent.kind : UI.catKind, parentId: parent ? parent.id : null, archived: false, order: S.categories.length + 1 });
  toast('Category added', 'ok');
};
Actions['cat-edit'] = (el) => {
  const c = Cat.get(el.dataset.id), used = Cat.inUse(c.id) || Cat.subs(c.id, true).some(s => Cat.inUse(s.id));
  const n = S.transactions.filter(t => t.categoryId === c.id || t.subcategoryId === c.id).length;
  const targets = [];
  for (const t of Cat.tops(c.kind)) { if (!c.parentId && t.id === c.id) continue; targets.push([t.id, t.name]); if (c.parentId) Cat.subs(t.id).forEach(s => { if (s.id !== c.id) targets.push([t.id + '|' + s.id, '   › ' + s.name]); }); }
  const root = Sheet.open({ title: c.parentId ? 'Edit subcategory' : 'Edit category', body: `<form>
    ${C.field('Name', `<input name="name" required maxlength="60" value="${esc(c.name)}">`)}
    <p class="muted small">${n} transaction${n === 1 ? '' : 's'} use this ${c.parentId ? 'subcategory' : 'category'}.</p>
    ${n ? `<h4>Reassign transactions</h4>${C.field('Move all its transactions to', `<select name="moveTo">${C.options(targets, '', { blank: '— Do not move —' })}</select>`)}` : ''}
    <div class="form-btns">${c.key ? '' : `<button type="button" class="btn danger-o" data-del>${c.archived ? 'Unarchive' : (used ? 'Archive' : 'Delete')}</button>`}<button class="btn primary">Save</button></div>
    ${c.key ? '<p class="hint">This category is used by the app for special calculations and cannot be removed, but you can rename it.</p>' : ''}</form>` });
  const form = $('form', root);
  form.onsubmit = async (e) => {
    e.preventDefault(); const d = formData(form);
    if (!d.name) return fieldError(form, 'name', 'Enter a name');
    await Store.save('categories', { ...c, name: d.name });
    if (d.moveTo) {
      const [catId, subId] = d.moveTo.split('|');
      const list = S.transactions.filter(t => t.categoryId === c.id || t.subcategoryId === c.id);
      if (!(await Dialog.confirm(`Move ${list.length} transaction${list.length === 1 ? '' : 's'} to ${Cat.full(catId, subId)}? Reports will be recalculated.`, { ok: 'Move' }))) return;
      await Store.saveMany('transactions', list.map(t => ({ ...t, categoryId: catId, subcategoryId: subId || (c.parentId ? null : (t.categoryId === c.id ? null : t.subcategoryId)), updatedAt: nowIso() })));
    }
    await Sheet.close(); toast('Saved', 'ok');
  };
  root.querySelector('[data-del]')?.addEventListener('click', async () => {
    if (c.archived) { await Store.save('categories', { ...c, archived: false }); return Sheet.close(); }
    if (used) {
      if (!(await Dialog.confirm(`“${c.name}” has history, so it will be archived (hidden from new entries). Existing transactions and reports are kept.`, { ok: 'Archive' }))) return;
      await Store.save('categories', { ...c, archived: true });
      if (!c.parentId) await Store.saveMany('categories', Cat.subs(c.id, true).map(s => ({ ...s, archived: true })));
    } else {
      if (!(await Dialog.confirm(`Delete “${c.name}”${!c.parentId && Cat.subs(c.id, true).length ? ' and its subcategories' : ''}?`, { ok: 'Delete', danger: true }))) return;
      for (const s of Cat.subs(c.id, true)) await Store.remove('categories', s.id);
      await Store.remove('categories', c.id);
    }
    await Sheet.close();
  });
};

/* --------------------------- payment methods --------------------------- */
More.payments = () => {
  const list = S.settings.paymentMethods || [];
  return C.header('Payment methods', { back: 'more' }) + `<section class="card"><div class="list">${list.map((p, i) => `<div class="li"><div class="li-main"><b>${esc(p)}</b>${p === S.settings.defaultPaymentMethod ? '<span class="muted">Default</span>' : ''}</div><div class="li-end"><button class="btn-link" data-act="pm-ren" data-i="${i}">Rename</button><button class="btn-link neg" data-act="pm-del" data-i="${i}">Remove</button></div></div>`).join('')}</div></section>
    <button class="btn wide primary" data-act="pm-add">Add payment method</button><p class="hint pad">Removing a method does not change past transactions.</p>`;
};
Actions['pm-add'] = async () => { const n = await Dialog.prompt('Name of payment method', { title: 'Add payment method', ok: 'Add' }); if (n && n.trim()) { if ((S.settings.paymentMethods || []).includes(n.trim())) return toast('Already exists', 'err'); await Store.setSetting('paymentMethods', [...(S.settings.paymentMethods || []), n.trim()]); rerender(); } };
Actions['pm-del'] = async (el) => { const l = [...S.settings.paymentMethods], p = l[+el.dataset.i]; if (await Dialog.confirm(`Remove “${p}” from the list?`, { ok: 'Remove', danger: true })) { l.splice(+el.dataset.i, 1); await Store.setSetting('paymentMethods', l); if (S.settings.defaultPaymentMethod === p) await Store.setSetting('defaultPaymentMethod', ''); rerender(); } };
Actions['pm-ren'] = async (el) => {
  const l = [...S.settings.paymentMethods], old = l[+el.dataset.i];
  const n = await Dialog.prompt(`Rename “${old}” to:`, { title: 'Rename', ok: 'Rename' }); if (!n || !n.trim() || n.trim() === old) return;
  l[+el.dataset.i] = n.trim(); await Store.setSetting('paymentMethods', l);
  const affected = S.transactions.filter(t => t.paymentMethod === old);
  if (affected.length && await Dialog.confirm(`Also update ${affected.length} past transaction${affected.length === 1 ? '' : 's'} that use “${old}”?`, { ok: 'Update' })) await Store.saveMany('transactions', affected.map(t => ({ ...t, paymentMethod: n.trim() })));
  if (S.settings.defaultPaymentMethod === old) await Store.setSetting('defaultPaymentMethod', n.trim());
  rerender();
};

/* ------------------------------ preferences ------------------------------ */
More.prefs = () => {
  const s = S.settings;
  return C.header('Preferences', { back: 'more' }) + `<form class="card" data-mount="prefs">
    <div class="row2">${C.field('Currency symbol', `<input name="currency" maxlength="5" value="${esc(s.currency)}">`)}${C.field('Currency code', `<input name="currencyCode" maxlength="3" value="${esc(s.currencyCode)}">`)}</div>
    <p class="hint">Display only — amounts are not converted. Default MK / MWK.</p>
    ${C.field('Date format', `<select name="dateFormat">${C.options([['DD/MM/YYYY', '20/11/2026'], ['D MMM YYYY', '20 Nov 2026'], ['YYYY-MM-DD', '2026-11-20'], ['MM/DD/YYYY', '11/20/2026']], s.dateFormat)}</select>`)}
    ${C.field('Default account', `<select name="defaultAccountId">${C.acctOptions(s.defaultAccountId)}</select>`)}
    ${C.field('Default payment method', `<select name="defaultPaymentMethod">${C.options((s.paymentMethods || []).map(p => [p, p]), s.defaultPaymentMethod || '', { blank: '— None —' })}</select>`)}
    ${C.field('Budget suggestions use the average of the last', `<select name="budgetSuggestMonths">${C.options([['3', '3 months'], ['6', '6 months'], ['12', '12 months']], String(s.budgetSuggestMonths || 3))}</select>`)}
    <p class="hint">Time zone: Africa/Blantyre (CAT, UTC+2).</p>
    <div class="form-btns"><button class="btn primary">Save preferences</button></div></form>
    <section class="card"><h3>Reset all data</h3><p class="muted small">Permanently erases every transaction, budget, account and setting on this phone.</p><button class="btn danger-o" data-act="reset">Reset data…</button></section>`;
};
Mounts.prefs = (form) => {
  form.onsubmit = async (e) => {
    e.preventDefault(); const d = formData(form);
    if (!d.currency) return fieldError(form, 'currency', 'Enter a currency symbol');
    for (const k of ['currency', 'currencyCode', 'dateFormat', 'defaultAccountId', 'defaultPaymentMethod']) await Store.setSetting(k, d[k]);
    await Store.setSetting('budgetSuggestMonths', +d.budgetSuggestMonths);
    Store.changed(); toast('Preferences saved', 'ok');
  };
};
Actions.reset = async () => {
  const ok = await Dialog.show({ title: 'Erase all data?', message: 'This cannot be undone. Make a backup first if you may need these records. Type DELETE to confirm.', input: { placeholder: 'DELETE' }, buttons: [{ label: 'Cancel', value: false }, { label: 'Back up first', value: 'backup' }, { label: 'Erase', value: 'erase', danger: true }] });
  if (!ok) return;
  if (ok.value === 'backup') return go('more/backup');
  if (ok.text !== 'DELETE') return toast('Not erased — you must type DELETE', 'err');
  const keep = settingsToRecords().filter(r => ['pin', 'webauthn', 'pinLength'].includes(r.key));
  await Store.replaceAll({ settings: keep });
  await Seed.run(); Store.changed(); go('home'); toast('All data erased');
};

/* --------------------------- backup & export --------------------------- */
More.backup = () => {
  const s = S.settings;
  return C.header('Backup & restore', { back: 'more' }) +
    `<div class="banner warn"><div>Your records are stored <b>only on this phone</b>. Uninstalling the app, clearing Chrome's site data or losing the phone will delete them. Back up regularly and keep the file somewhere safe (Google Drive, email to yourself, a computer).</div></div>
    <section class="card"><h3>Status</h3>
      <div class="kv"><span>Last backup</span><b>${s.lastBackupAt ? D.fmt(D._fmt.format(new Date(s.lastBackupAt))) + ' ' + new Date(s.lastBackupAt).toLocaleTimeString('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit' }) : '<span class="neg">Never</span>'}</b></div>
      ${s.lastBackupFile ? `<div class="kv"><span>File</span><b class="small">${esc(s.lastBackupFile)}</b></div>` : ''}
      <div class="kv"><span>Records</span><b>${S.transactions.length} transactions · ${S.budgets.length} budgets · ${S.accounts.length} accounts</b></div>
      <div class="kv"><span>Protected from automatic clean-up</span><b id="persist">checking…</b></div>
      <div class="kv"><span>Storage engine</span><b>${DB.memory ? '<span class="neg">Temporary memory</span>' : 'IndexedDB (on this device)'}</b></div></section>
    <section class="card"><h3>Create backup</h3><p class="muted small">Exports your complete database to one file. Optionally encrypt it with a password (AES-256). Without the password, an encrypted backup cannot be restored, so keep the password safe.</p>
      <button class="btn primary wide" data-act="bk-create">Create backup file</button></section>
    <section class="card"><h3>Restore from backup</h3><p class="muted small">Replaces all data on this phone with the backup's contents. You will see what the file contains and confirm before anything is overwritten.</p>
      <label class="btn wide filebtn">Choose backup file…<input type="file" accept=".json,application/json" data-change="bk-restore" hidden></label></section>
    <section class="card"><h3>Export</h3><div class="btnrow"><button class="btn" data-act="exp-tx">All transactions (CSV)</button><button class="btn" data-act="go" data-to="reports">Reports (PDF/CSV)</button></div><p class="hint">CSV files open in Excel or Google Sheets.</p></section>
    <span data-mount="persist"></span>`;
};
Mounts.persist = async () => { const el = $('#persist'); if (!el) return; try { el.innerHTML = navigator.storage?.persisted ? ((await navigator.storage.persisted()) ? '<span class="pos">Yes</span>' : 'No — install the app to improve this') : 'Unknown'; } catch (e) { el.textContent = 'Unknown'; } };
Actions['exp-tx'] = async () => { const saved = { ...UI.txf }; Object.assign(UI.txf, { q: '', group: 'all', from: '', to: '', categoryId: '', paymentMethod: '', accountId: '' }); await Actions['tx-export'](); Object.assign(UI.txf, saved); };
Actions['bk-create'] = async () => {
  if (!Crypt.available) return Dialog.alert('Backups need a secure (https) connection. Open the installed app.');
  const hash = await Backup.contentHash();
  if (S.settings.lastBackupHash === hash && !(await Dialog.confirm(`Nothing has changed since your last backup (${D.fmt(S.settings.lastBackupAt.slice(0, 10))}). Create another identical backup anyway?`, { title: 'Duplicate backup', ok: 'Create anyway' }))) return;
  const choice = await Dialog.show({ title: 'Encrypt this backup?', message: 'Recommended. You will need the password to restore.', buttons: [{ label: 'Cancel', value: false }, { label: 'No password', value: 'plain' }, { label: 'Use password', value: 'enc', primary: true }] });
  if (!choice) return;
  let pw = null;
  if (choice === 'enc') {
    pw = await Dialog.prompt('Choose a backup password (at least 6 characters).', { title: 'Backup password', type: 'password', ok: 'Next' }); if (pw == null) return;
    if (pw.length < 6) return toast('Password must be at least 6 characters', 'err');
    const pw2 = await Dialog.prompt('Type the password again.', { title: 'Confirm password', type: 'password', ok: 'Create backup' }); if (pw2 == null) return;
    if (pw !== pw2) return toast('Passwords do not match', 'err');
  }
  toast('Preparing backup…');
  const b = await Backup.create(pw);
  const done = await exportChooser(b.text, b.filename, 'application/json', `${S.transactions.length} transactions${pw ? ' · encrypted' : ''}`);
  if (done) { await Backup.recordDone(await Backup.contentHash(), b.filename); rerender(); }
};
Actions['bk-restore'] = async (el) => {
  const file = el.files[0]; el.value = ''; if (!file) return;
  if (!Crypt.available) return Dialog.alert('Restoring needs a secure (https) connection. Open the installed app.');
  const text = await file.text(); let res, pw = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    try { res = await Backup.open(text, pw); break; }
    catch (e) {
      if (e.code === 'pw' || e.code === 'badpw') { pw = await Dialog.prompt(e.code === 'badpw' ? 'Wrong password. Try again.' : 'This backup is encrypted. Enter its password.', { title: 'Backup password', type: 'password', ok: 'Open' }); if (pw == null) return; continue; }
      return Dialog.alert(e.message, 'Cannot restore');
    }
  }
  if (!res) return Dialog.alert('Too many wrong password attempts.', 'Cannot restore');
  const c = res.env.counts, created = new Date(res.env.createdAt);
  const choice = await Dialog.show({ title: 'Replace all current data?', html: `<p>Backup created <b>${created.toLocaleString('en-GB', { timeZone: TZ, dateStyle: 'medium', timeStyle: 'short' })}</b>, verified OK.</p>
      <p>It contains ${c.transactions} transactions, ${c.accounts} accounts, ${c.budgets} budgets, ${c.goals} goals, ${c.loans} loans, ${c.assets} assets.</p>
      <p class="neg"><b>This phone currently has ${S.transactions.length} transactions. They will be permanently replaced.</b></p>`,
    buttons: [{ label: 'Cancel', value: false }, { label: 'Back up current first', value: 'bk' }, { label: 'Replace data', value: 'go', danger: true }] });
  if (!choice) return;
  if (choice === 'bk') { const b = await Backup.create(null); Files.download(b.text, b.filename.replace('PFM-backup', 'PFM-before-restore'), 'application/json'); toast('Current data saved to Downloads'); if (!(await Dialog.confirm('Current data saved. Now replace it with the backup?', { ok: 'Replace data', danger: true }))) return; }
  await Backup.restore(res.data);
  toast(`Restored ${c.transactions} transactions`, 'ok'); go('home');
};

/* ------------------------------ security ------------------------------ */
More.security = () => {
  const on = Lock.enabled();
  return C.header('App lock', { back: 'more' }) + `<section class="card"><h3>PIN</h3>
    <p class="muted small">${on ? 'A PIN is required to open the app.' : 'No PIN set. Anyone with your unlocked phone can open the app.'}</p>
    <div class="btnrow">${on ? '<button class="btn" data-act="pin-set">Change PIN</button><button class="btn danger-o" data-act="pin-off">Remove PIN</button>' : '<button class="btn primary" data-act="pin-set">Set a PIN</button>'}</div>
    ${on ? C.field('Lock again after the app is in the background for', `<select data-change="autolock">${C.options([['0', 'Immediately'], ['60', '1 minute'], ['300', '5 minutes'], ['900', '15 minutes']], String(S.settings.autoLockSeconds ?? 60))}</select>`) : ''}</section>
    <section class="card"><h3>Fingerprint / face unlock</h3><p class="muted small" id="bio-st">${on ? 'Checking support…' : 'Set a PIN first. The PIN stays as a backup.'}</p><span data-mount="bio"></span></section>
    <p class="hint pad">The lock protects the app's screens. Your data lives in this app's private storage on the phone. Android device encryption and your phone's screen lock protect it at rest. Backups can be encrypted with their own password. The app never stores banking passwords, card PINs or payment credentials.</p>`;
};
Mounts.bio = async (el) => {
  if (!Lock.enabled()) return;
  const st = $('#bio-st'), sup = await Lock.bioSupported();
  if (!sup) { st.textContent = 'Not available on this device or browser. (It needs the installed app on a phone with a fingerprint or face unlock set up.)'; return; }
  st.textContent = S.settings.webauthn ? 'Enabled. You can unlock with your fingerprint or face.' : 'Available on this phone.';
  el.innerHTML = S.settings.webauthn ? '<button class="btn danger-o" data-act="bio-off">Turn off</button>' : '<button class="btn primary" data-act="bio-on">Turn on</button>';
};
Actions.autolock = async (el) => { await Store.setSetting('autoLockSeconds', +el.value); toast('Saved'); };
Actions['pin-set'] = async () => {
  if (!Crypt.available) return Dialog.alert('Setting a PIN needs a secure (https) connection. Open the installed app.');
  if (Lock.enabled()) { const old = await Dialog.prompt('Enter your current PIN', { type: 'password', inputmode: 'numeric', title: 'Change PIN' }); if (old == null) return; if (!(await Lock.check(old))) return toast('Incorrect PIN', 'err'); }
  const p1 = await Dialog.prompt('Choose a 4–6 digit PIN', { type: 'password', inputmode: 'numeric', title: 'New PIN', ok: 'Next' }); if (p1 == null) return;
  if (!/^\d{4,6}$/.test(p1)) return toast('PIN must be 4 to 6 digits', 'err');
  const p2 = await Dialog.prompt('Enter the PIN again', { type: 'password', inputmode: 'numeric', title: 'Confirm PIN', ok: 'Set PIN' }); if (p2 == null) return;
  if (p1 !== p2) return toast('PINs do not match', 'err');
  await Lock.setPin(p1); await Store.setSetting('pinLength', p1.length); toast('PIN set', 'ok'); rerender();
};
Actions['pin-off'] = async () => { const p = await Dialog.prompt('Enter your PIN to remove it', { type: 'password', inputmode: 'numeric', title: 'Remove PIN' }); if (p == null) return; if (!(await Lock.check(p))) return toast('Incorrect PIN', 'err'); await Lock.removePin(); toast('PIN removed'); rerender(); };
Actions['bio-on'] = async () => { try { await Lock.enableBio(); toast('Fingerprint unlock enabled', 'ok'); } catch (e) { toast('Could not enable: ' + (e.message || e.name), 'err'); } rerender(); };
Actions['bio-off'] = async () => { await Store.setSetting('webauthn', null); rerender(); };

/* ------------------------------ about ------------------------------ */
More.about = () => C.header('About', { back: 'more' }) + `<section class="card prose">
  <h3>Personal Finance Manager ${APP_VERSION}</h3><p>Private and offline. No account, no cloud, no internet connection, no bank links. All records stay on this phone.</p>
  <h3>How figures are calculated</h3>
  <dl>
  <dt>Total income</dt><dd>Net amounts of all Income transactions dated in the period.</dd>
  <dt>Total expenditure</dt><dd>All Expense transactions plus the interest part of loan repayments. Excluded: transfers, savings and investment contributions, loan principal, loans received and balance adjustments.</dd>
  <dt>Net cash flow</dt><dd>Total income − total expenditure.</dd>
  <dt>Available cash balance</dt><dd>Opening cash + income − expenditure − savings − investments − loan principal ± other movements, where cash = cash, bank current and mobile money accounts. Each account's balance is its opening balance plus every recorded transaction.</dd>
  <dt>Savings contributions</dt><dd>Savings and Investment transactions only. Unspent cash is <i>not</i> counted as savings.</dd>
  <dt>Savings rate</dt><dd>(Savings + investment contributions) ÷ total income × 100.</dd>
  <dt>Budget utilisation</dt><dd>Actual expenditure ÷ allocated budget × 100. Levels: below 70% normal, 70–89% approaching, 90–99% warning, 100%+ overspending. The overall figure covers budgeted categories only.</dd>
  <dt>Budget suggestion</dt><dd>Average actual spending over the previous 3 months (configurable), rounded to MK 1,000. Applied only when you choose it and save.</dd>
  <dt>Loan outstanding</dt><dd>Outstanding balance entered − principal repayments recorded.</dd>
  <dt>Net worth</dt><dd>Total assets (account balances + latest valuation of other assets) − total liabilities. Liquid: cash, bank, mobile money, savings accounts. Non-liquid: fixed deposits, investments, vehicles, land, property (estimated values, not available cash).</dd>
  </dl>
  <p>Amounts are stored as whole tambala (integers), so there are no rounding errors. Monthly summaries are always recalculated from the stored transactions, so a correction to any past transaction updates every report.</p>
  <p class="muted small">Time zone: Africa/Blantyre. Currency: Malawi Kwacha.</p></section>`;

'use strict';
/* main.js — boot */
(async function boot() {
  $('#nav').innerHTML = [['home', 'Home', I.home], ['tx', 'Transactions', I.list], ['budgets', 'Budgets', I.budget], ['reports', 'Reports', I.report], ['more', 'More', I.more]]
    .map(([v, l, ic]) => `<a href="#/${v}" data-view="${v}">${ic}<span>${l}</span></a>`).join('');
  $('#fab').innerHTML = I.plus; $('#fab').onclick = () => TxForm.open();
  try {
    await DB.open();
    await Store.load();
  } catch (e) {
    console.error(e);
    $('#view').innerHTML = `<div class="card error"><h3>Could not open your data</h3><p>${esc(e.message)}</p><p>Close and reopen the app. If this continues, restore from a backup.</p></div>`;
    return;
  }
  Store.listeners.push(rerender);
  Lock.init();
  route();
  document.body.classList.add('ready');
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); UI.installPrompt = e; rerender(); });
  window.addEventListener('appinstalled', () => { UI.installPrompt = null; toast('App installed', 'ok'); rerender(); });
  // Keep "today" correct if the app stays open past midnight
  let lastDay = D.today();
  setInterval(() => { const t = D.today(); if (t !== lastDay) { if (UI.month === lastDay.slice(0, 7)) UI.month = t.slice(0, 7); lastDay = t; Calc.clearCache(); rerender(); } }, 60000);
  window.PFM = { S, Calc, Money, D, Store, Backup, Insights }; // for diagnostics/testing
})();

</script>
</body>
