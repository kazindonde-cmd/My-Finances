<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3d3e">
<meta name="description" content="Private, offline personal finance manager">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>My Finances</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f6f5;--surface:#fff;--surface-2:#f0f3f2;--line:#e2e7e5;--ink:#14201f;--ink-2:#4d5b59;--ink-3:#7b8886;
  --brand:#0f3d3e;--brand-2:#14595a;--accent:#1b8a5a;--accent-ink:#fff;
  --pos:#137a43;--neg:#c23b33;--neu:#4d5b59;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s-budget:#c9d3d1;
  --ok:#0ca30c;--near:#fab219;--warn:#ec835a;--over:#d03b3b;--goal:#2a78d6;
  --r:14px;--shadow:0 1px 2px rgba(15,61,62,.06),0 2px 8px rgba(15,61,62,.05);
  --nav-h:62px;--safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1514;--surface:#18201f;--surface-2:#1f2928;--line:#2b3735;--ink:#eef2f1;--ink-2:#b5c1bf;--ink-3:#8a9794;
  --brand:#5fd3a6;--brand-2:#7ee0b8;--accent:#2fb37a;--accent-ink:#06120e;
  --pos:#4cc788;--neg:#f07a72;--neu:#b5c1bf;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s-budget:#3a4846;
  --shadow:none;color-scheme:dark;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 24px);overscroll-behavior-y:contain}
body.is-locked{overflow:hidden}
#view{max-width:600px;margin:0 auto;padding:0 12px}
a{color:var(--brand-2)}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
h3{font-size:15px}h4{font-size:13px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}
.muted{color:var(--ink-3)}.small{font-size:12.5px}.center{text-align:center}.pos{color:var(--pos)}.neg{color:var(--neg)}.pad{padding:0 4px}
.invisible{visibility:hidden}
/* top */
.top{display:flex;align-items:center;gap:8px;padding:14px 2px 8px;position:sticky;top:0;background:var(--bg);z-index:5}
.top h1{font-size:20px;flex:1}.top-act{display:flex;gap:4px}
.brand{display:flex;align-items:center;gap:10px}.brand svg{width:30px;height:30px}
.icon-btn{border:0;background:transparent;width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;color:var(--ink-2);cursor:pointer;position:relative;flex:none}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg,.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.badge::after{content:attr(data-n);position:absolute;top:4px;right:4px;background:var(--accent);color:var(--accent-ink);font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center}
/* month bar */
.monthbar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:var(--r);padding:4px;margin:4px 0 12px;box-shadow:var(--shadow)}
.mb-label{border:0;background:transparent;font-weight:650;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:4px 10px}
.mb-label small{font-weight:400;font-size:11px;color:var(--ink-3)}
/* cards & stats */
.card{background:var(--surface);border-radius:var(--r);padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.card.error{border:1px solid var(--neg)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.card .stats{margin-bottom:6px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);min-width:0}
.card .stat{background:var(--surface-2);box-shadow:none}
.stat[role=button]{cursor:pointer}
.stat-l{font-size:12px;color:var(--ink-3);font-weight:550;text-transform:uppercase;letter-spacing:.03em}
.stat-v{font-size:19px;font-weight:700;margin-top:2px;overflow-wrap:anywhere;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.stat-s{font-size:12px;color:var(--ink-2);margin-top:3px}
.stat.hero{background:var(--brand);color:#fff}.stat.hero .stat-l,.stat.hero .stat-s{color:rgba(255,255,255,.75)}
@media (prefers-color-scheme:dark){.stat.hero{background:#123c37}}
.stats.four{grid-template-columns:1fr 1fr}
.stat .prog{margin:6px 0 4px}
.netflow{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow);font-size:14px;color:var(--ink-2)}
.netflow b{font-size:17px;white-space:nowrap}.netflow span{flex:1;padding-right:8px}.netflow.pos b{color:var(--pos)}.netflow.neg b{color:var(--neg)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:14px}
.banner.info{background:#e3effc;color:#123a66}.banner.warn{background:#fff3d6;color:#5a3d00}.banner.bad{background:#fde3e1;color:#7a1712}
@media (prefers-color-scheme:dark){.banner.info{background:#16283d;color:#cfe3fb}.banner.warn{background:#3a2e10;color:#ffe7ad}.banner.bad{background:#3d1714;color:#ffd0cc}}
.banner-btns{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.welcome ol{padding-left:20px;margin:8px 0}.welcome li{margin:4px 0}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}.sec-h h2{font-size:17px}
.grp-h{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:18px 4px 6px}
/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--neg);border-color:var(--neg);color:#fff}
.btn.danger-o{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,transparent)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:10px}
.btn.wide{width:100%;margin:4px 0 12px}
.btn-link{border:0;background:none;color:var(--brand-2);font-weight:600;cursor:pointer;padding:4px;text-decoration:none;font-size:14px}
.btn-link.neg{color:var(--neg)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}.btnrow.tight{margin:0;gap:6px}
.filebtn{cursor:pointer}
/* FAB & nav */
#fab{position:fixed;right:max(16px,calc(50vw - 284px));bottom:calc(var(--nav-h) + var(--safe-b) + 16px);width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(27,138,90,.35);display:grid;place-items:center;z-index:20;cursor:pointer}
#fab svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:20}
.nav a{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--ink-3);text-decoration:none;font-weight:550}
.nav a.active{color:var(--brand-2)}
.nav a.active svg{stroke-width:2.4}
/* transactions */
.txlist{display:flex;flex-direction:column}
.day-h{font-size:12px;font-weight:650;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;padding:12px 4px 4px}
.tx{display:flex;align-items:center;gap:12px;border:0;background:transparent;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border-bottom:0}
.tx-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:700;flex:none;font-size:16px}
.ic-in{background:color-mix(in srgb,var(--pos) 15%,transparent);color:var(--pos)}
.ic-out{background:color-mix(in srgb,var(--neg) 13%,transparent);color:var(--neg)}
.ic-tr{background:var(--surface-2);color:var(--ink-2)}
.ic-sv{background:color-mix(in srgb,var(--s1) 15%,transparent);color:var(--s1)}
.ic-ln{background:color-mix(in srgb,var(--s2) 15%,transparent);color:var(--s2)}
.tx-main{flex:1;min-width:0;display:flex;flex-direction:column}
.tx-d{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-s{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap}.amt.pos{color:var(--pos)}.amt.neg{color:var(--ink)}.amt.neu{color:var(--ink-2)}
.searchbar{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.searchbar input{flex:1}
.tx-summary{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;font-size:13px;color:var(--ink-2);padding:6px 4px}
.active-f{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 4px 6px}
.sortrow{display:flex;justify-content:flex-end;padding:0 4px;font-size:13px;color:var(--ink-2)}
.sortrow select{width:auto;min-height:34px;padding:4px 8px;margin-left:6px}
#txresults .txlist{background:var(--surface);border-radius:var(--r);padding:0 10px;margin-top:6px;box-shadow:var(--shadow)}
.empty{padding:22px 10px;text-align:center;color:var(--ink-3)}
.empty .btn{margin-top:10px}
/* chips & segments */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-bottom:4px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:550;cursor:pointer;white-space:nowrap;min-height:36px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.chip.on{color:#06120e}}
.chip.sm{padding:5px 10px;font-size:12.5px;min-height:32px}
.chip.alt{background:var(--surface-2);border-style:dashed}
.chip.arch{opacity:.5;text-decoration:line-through}
.subchips{margin-top:8px;padding:8px;background:var(--surface-2);border-radius:12px}
.recent{margin-bottom:10px}.recent .fl{display:block;margin-bottom:4px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer;min-height:36px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sec-h .seg{margin:0;width:180px}
.type-seg{overflow-x:auto}.type-seg button{min-width:58px;font-size:12.5px}
/* forms */
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px;min-height:44px;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
input.big{font-size:28px;font-weight:700;padding:10px 12px;min-height:58px}
.invalid,.chips.invalid{border-color:var(--neg)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--neg) 20%,transparent);border-radius:11px}
.field{display:block;margin-bottom:12px}
.fl{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.hint{font-size:12.5px;color:var(--ink-3);margin:-4px 0 12px;display:block}
.warn-h{color:#8a5a00}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2.pad{padding:0}
details.more{border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
details summary{cursor:pointer;font-weight:600;color:var(--brand-2);padding:6px 0 10px;font-size:14px}
.check{display:flex;gap:10px;align-items:center;margin:4px 0 12px;font-size:14px}.check input{width:20px;height:20px;min-height:0}
.form-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.form-btns .btn.primary{flex:1;max-width:240px}
.form-btns.sticky{position:sticky;bottom:-16px;background:var(--surface);padding:10px 0 4px;border-top:1px solid var(--line)}
/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left;cursor:default}
button.li{cursor:pointer}
.li:last-child{border-bottom:0}
.li-main{display:flex;flex-direction:column;min-width:0;flex:1}.li-main span{font-size:12.5px}
.li-end{display:flex;align-items:center;gap:8px;text-align:right;white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}.kv span{color:var(--ink-2)}.kv b{text-align:right}
.menu{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.menu a{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.menu a:last-child{border-bottom:0}
.menu a span{display:flex;flex-direction:column}.menu small{color:var(--ink-3);font-size:12.5px}
.menu svg{width:18px;height:18px;fill:none;stroke:var(--ink-3);stroke-width:2}
.pill{display:inline-block;font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;vertical-align:middle}
.st-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:#0a6e0a}
.st-near{background:color-mix(in srgb,var(--near) 25%,transparent);color:#7a5200}
.st-warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:#9a3a14}
.st-over{background:color-mix(in srgb,var(--over) 16%,transparent);color:#a31f1f}
.st-none{background:var(--surface-2);color:var(--ink-3)}
@media (prefers-color-scheme:dark){.st-ok{color:#7ee07e}.st-near{color:#ffd47a}.st-warn{color:#ffb595}.st-over{color:#ff9d9d}}
.st-t{font-weight:650}
td.st-t.st-ok,td.st-t.st-near,td.st-t.st-warn,td.st-t.st-over{background:none}
.st-t.st-ok{color:var(--pos)}.st-t.st-near{color:#a06c00}.st-t.st-warn{color:#c2541f}.st-t.st-over{color:var(--neg)}
.legend-st{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
/* progress */
.prog{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.card .stat .prog{background:var(--line)}
.prog-fill{height:100%;border-radius:99px}
.st-bg-ok{background:var(--ok)}.st-bg-near{background:var(--near)}.st-bg-warn{background:var(--warn)}.st-bg-over{background:var(--over)}.st-bg-goal{background:var(--goal)}.st-bg-none{background:var(--ink-3)}
/* budgets */
.brow{padding:10px 0;border-bottom:1px solid var(--line)}.brow:last-child{border-bottom:0}
.brow.sub{padding-left:16px}.brow.sub b{font-weight:550}
.brow-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.brow-s{font-size:12.5px;color:var(--ink-2);margin-top:5px}
.bed-group{border-bottom:1px solid var(--line);padding:8px 0}
.bed{display:grid;grid-template-columns:1fr 130px 78px;gap:8px;align-items:center;margin:4px 0}
.bed.sub{padding-left:12px}.bed.sub .bed-l{font-size:13.5px;color:var(--ink-2)}
.bed-l{font-weight:600;font-size:14px}
.bed input{min-height:40px;padding:6px 10px;font-size:15px}
.bed .chip{justify-self:start;padding:4px 8px}
.goal-fig{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}.goal-fig b{font-size:20px}.goal-p{margin-left:auto;font-weight:650;color:var(--ink-2)}
.goal .btn,.card .btnrow{margin-top:10px}
/* charts */
.charts{display:grid;grid-template-columns:1fr;gap:0}
.chart{width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}.chart .grid.zero{stroke:var(--ink-3)}
.chart .ax{font-size:10px;fill:var(--ink-3)}
.chart .mark.s1,.chart .mark.pos{fill:var(--s1)}.chart .mark.s2{fill:var(--s2)}.chart .mark.s3{fill:var(--s3)}.chart .mark.neg{fill:var(--s2)}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round}.chart .ln.s1{stroke:var(--s1)}.chart .ln.s2{stroke:var(--s2)}.chart .ln.s3{stroke:var(--s3)}
.chart .area.s1{fill:color-mix(in srgb,var(--s1) 12%,transparent)}.chart .area.s2{fill:color-mix(in srgb,var(--s2) 12%,transparent)}.chart .area.s3{fill:color-mix(in srgb,var(--s3) 14%,transparent)}
.chart .dot{stroke:var(--surface);stroke-width:2}.chart .dot.s1{fill:var(--s1)}.chart .dot.s2{fill:var(--s2)}.chart .dot.s3{fill:var(--s3)}
.chart .hit{fill:transparent;cursor:pointer}
.chart-empty{padding:26px 8px;text-align:center;color:var(--ink-3);font-size:13.5px;background:var(--surface-2);border-radius:10px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}.sw.s1{background:var(--s1)}.sw.s2{background:var(--s2)}.sw.s3{background:var(--s3)}.sw.s-budget{background:var(--s-budget)}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{cursor:pointer}
.hb-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:3px}
.hb-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb-v{white-space:nowrap;font-weight:600}.hb-v small{color:var(--ink-3);font-weight:500;margin-left:3px}
.hb-track{height:8px;background:var(--surface-2);border-radius:99px}
.hb-fill{height:100%;background:var(--s2);border-radius:99px}
.bva{display:flex;flex-direction:column;gap:10px}
.bva-row{cursor:pointer}
.bva-bar{height:7px;margin-top:2px}
.b-alloc{height:100%;background:var(--s-budget);border-radius:99px}.b-act{height:100%;border-radius:99px}
#tip{position:absolute;z-index:60;background:#14201f;color:#fff;font-size:12.5px;padding:7px 10px;border-radius:9px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.2)}
/* insights */
.insights{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.insights li{padding:9px 10px 9px 34px;border-radius:10px;background:var(--surface-2);font-size:14px;position:relative}
.insights li::before{position:absolute;left:10px;top:9px;font-weight:700;width:16px;text-align:center}
.in-info::before{content:"i";color:var(--s1)}.in-good::before{content:"✓";color:var(--pos)}.in-warn::before{content:"!";color:#c2541f}.in-bad::before{content:"!";color:var(--neg)}
.in-bad{background:color-mix(in srgb,var(--neg) 9%,var(--surface-2))!important}
/* tables & reports */
.tbl-wrap{overflow-x:auto;margin:6px 0 10px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.03em;font-weight:650;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:not(:first-child),.tbl th:not(:first-child){text-align:right;white-space:nowrap}
.tbl tr.grp td{background:var(--surface-2)}
.tbl tr.tot td,.tbl tfoot td{font-weight:700;border-top:1.5px solid var(--ink-3)}
.tbl tr.big td{font-size:14.5px}
.up{color:var(--neg)}.down{color:var(--pos)}

<body>
<main id="view"><div id="boot">Opening your finances…</div></main>
<button id="fab" aria-label="Add transaction" hidden></button>
<nav id="nav" class="nav" aria-label="Main"></nav>
<div id="layers"></div>
<div id="toasts" aria-live="polite"></div>
<div id="tip" role="tooltip" hidden></div>
<div id="lock" hidden></div>
<noscript>This app needs JavaScript enabled.</noscript>
<script>
'use strict';
/* =========================================================================
   PFM — Personal Finance Manager
   core.js : money, dates, local database, state, financial calculations
   All money is stored as INTEGER TAMBALA (1 MK = 100 tambala). Never floats.
   ========================================================================= */
const APP_VERSION = '1.0.0';
const SCHEMA_VERSION = 1;
const DB_NAME = 'pfm-finance';
const DB_VERSION = 1;
const TZ = 'Africa/Blantyre';

/* ---------------------------- utilities ---------------------------- */
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + f(x), 0);
const byId = (list, id) => list.find(x => x.id === id);
const nowIso = () => new Date().toISOString();

/* ------------------------------ money ------------------------------ */
const Money = {
  /** Parse user text -> integer tambala, or NaN. Accepts "1,500,000", "1500000.50", "MK 2,000". */
  parse(input) {
    if (input == null) return NaN;
    let s = String(input).trim().replace(/^mk/i, '').replace(/[,\s]/g, '');
    if (!s) return NaN;
    let neg = false;
    if (s[0] === '-' || s[0] === '−') { neg = true; s = s.slice(1); }
    if (!/^\d*(\.\d{0,2})?$/.test(s) || s === '.' || s === '') return NaN;
    const [i, f = ''] = s.split('.');
    const v = parseInt(i || '0', 10) * 100 + parseInt((f + '00').slice(0, 2), 10);
    if (!Number.isSafeInteger(v)) return NaN;
    return neg ? -v : v;
  },
  /** tambala -> plain input text ("1500000" or "1500000.50") */
  toInput(t) {
    if (t == null || t === '') return '';
    const neg = t < 0, a = Math.abs(t), w = Math.floor(a / 100), f = a % 100;
    return (neg ? '-' : '') + w + (f ? '.' + String(f).padStart(2, '0') : '');
  },
  /** tambala -> "MK 1,500,000". Decimals only when there are tambala. */
  fmt(t, opt = {}) {
    if (t == null || Number.isNaN(t)) return '—';
    const neg = t < 0, a = Math.abs(Math.round(t)), w = Math.floor(a / 100), f = a % 100;
    const body = w.toLocaleString('en-US') + (f ? '.' + String(f).padStart(2, '0') : '');
    const sym = opt.symbol === false ? '' : (S.settings.currency || 'MK') + ' ';
    const sign = neg ? (opt.ascii ? '-' : '−') : (opt.plus && t > 0 ? '+' : '');
    return sign + sym + body;
  },
  /** compact for chart axes: 1.2M, 450k */
  short(t) {
    const v = Math.abs(t) / 100, s = t < 0 ? '−' : '';
    if (v >= 1e9) return s + (v / 1e9).toFixed(v >= 1e10 ? 0 : 1).replace(/\.0$/, '') + 'B';
    if (v >= 1e6) return s + (v / 1e6).toFixed(v >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
    if (v >= 1e3) return s + (v / 1e3).toFixed(v >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'k';
    return s + Math.round(v);
  },
  /** plain number for CSV (MK, no grouping) */
  csv(t) { return Money.toInput(t); },
};
const pct = (n, d) => (d > 0 ? (n / d) * 100 : null);
const fmtPct = (p, dp = 0) => (p == null || !isFinite(p) ? '—' : (Math.round(p * 10 ** dp) / 10 ** dp).toFixed(dp) + '%');

/* ------------------------------ dates ------------------------------ */
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const D = {
  _fmt: new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }),
  today() { return D._fmt.format(new Date()); },          // YYYY-MM-DD in Africa/Blantyre
  thisMonth() { return D.today().slice(0, 7); },
  valid(d) { return /^\d{4}-\d{2}-\d{2}$/.test(d) && !isNaN(Date.parse(d + 'T00:00:00Z')); },
  ym(d) { return d.slice(0, 7); },
  addMonths(ym, n) {
    let [y, m] = ym.split('-').map(Number); m += n;
    y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1;
    return `${y}-${String(m).padStart(2, '0')}`;
  },
  daysIn(ym) { const [y, m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); },
  start(ym) { return ym + '-01'; },
  end(ym) { return ym + '-' + String(D.daysIn(ym)).padStart(2, '0'); },
  addDays(d, n) { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); },
  /** add months to a date, clamping to month end, keeping the anchor day */
  addMonthsDate(d, n, anchorDay) {
    const ym = D.addMonths(d.slice(0, 7), n);
    const day = Math.min(anchorDay || +d.slice(8, 10), D.daysIn(ym));
    return ym + '-' + String(day).padStart(2, '0');
  },
  next(d, freq, anchorDay) {
    switch (freq) {
      case 'weekly': return D.addDays(d, 7);
      case 'monthly': return D.addMonthsDate(d, 1, anchorDay);
      case 'quarterly': return D.addMonthsDate(d, 3, anchorDay);
      case 'annually': return D.addMonthsDate(d, 12, anchorDay);
    }
    return d;
  },
  diffDays(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5); },
  monthsBetween(a, b) { const [y1, m1] = a.split('-').map(Number), [y2, m2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); },
  monthLabel(ym) { const [y, m] = ym.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; },
  monthShort(ym) { const [y, m] = ym.split('-').map(Number); return MONTHS[m - 1].slice(0, 3); },
  monthShortY(ym) { const [y, m] = ym.split('-').map(Number); return MONTHS[m - 1].slice(0, 3) + ' ' + String(y).slice(2); },
  fmt(d) {
    if (!d) return '';
    const [y, m, dd] = d.split('-');
    switch (S.settings.dateFormat) {
      case 'YYYY-MM-DD': return d;
      case 'D MMM YYYY': return `${+dd} ${MONTHS[+m - 1].slice(0, 3)} ${y}`;
      case 'MM/DD/YYYY': return `${m}/${dd}/${y}`;
      default: return `${dd}/${m}/${y}`;
    }
  },
  pretty(d) {
    const t = D.today();
    if (d === t) return 'Today';
    if (d === D.addDays(t, -1)) return 'Yesterday';
    const wd = new Date(d + 'T00:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', timeZone: 'UTC' });
    return `${wd}, ${D.fmt(d)}`;
  },
  quarterOf(ym) { const [y, m] = ym.split('-').map(Number); return { y, q: Math.floor((m - 1) / 3) + 1 }; },
  monthsInRange(fromYm, toYm) { const out = []; let m = fromYm; while (m <= toYm) { out.push(m); m = D.addMonths(m, 1); } return out; },
};

/* --------------------------- local database --------------------------- */
const STORES = {
  accounts: 'id', categories: 'id', transactions: 'id', budgets: 'id', recurring: 'id',
  goals: 'id', loans: 'id', assets: 'id', valuations: 'id', closes: 'month', settings: 'key',
};
const DB = {
  db: null, memory: false,
  open() {
    return new Promise((resolve) => {
      if (!('indexedDB' in self)) { DB.memory = true; return resolve(); }
      let req;
      try { req = indexedDB.open(DB_NAME, DB_VERSION); } catch (e) { DB.memory = true; return resolve(); }
      req.onupgradeneeded = (e) => {
        const db = req.result, old = e.oldVersion;
        // Migration steps — add new `if (old < N)` blocks for future schema versions.
        if (old < 1) {
          for (const [name, key] of Object.entries(STORES)) db.createObjectStore(name, { keyPath: key });
          const tx = req.transaction.objectStore('transactions');
          tx.createIndex('date', 'date'); tx.createIndex('type', 'type'); tx.createIndex('categoryId', 'categoryId');
          req.transaction.objectStore('budgets').createIndex('month', 'month');
          req.transaction.objectStore('valuations').createIndex('assetId', 'assetId');
        }
      };
      req.onsuccess = () => { DB.db = req.result; DB.db.onversionchange = () => DB.db.close(); resolve(); };
      req.onerror = () => { DB.memory = true; resolve(); };
      req.onblocked = () => { /* another tab open — wait */ };
    });
  },
  _tx(stores, mode, fn) {
    return new Promise((resolve, reject) => {
      const t = DB.db.transaction(stores, mode);
      let out;
      t.oncomplete = () => resolve(out);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error || new Error('Transaction aborted'));
      out = fn(t);
    });
  },
  async loadAll() {
    const data = {};
    if (DB.memory) { for (const s of Object.keys(STORES)) data[s] = []; return data; }
    await DB._tx(Object.keys(STORES), 'readonly', (t) => {
      for (const s of Object.keys(STORES)) {
        const r = t.objectStore(s).getAll();
        r.onsuccess = () => { data[s] = r.result; };
      }
    });
    return data;
  },
  put(store, obj) { if (DB.memory) return Promise.resolve(); return DB._tx([store], 'readwrite', t => { t.objectStore(store).put(obj); }); },
  putMany(store, list) { if (DB.memory || !list.length) return Promise.resolve(); return DB._tx([store], 'readwrite', t => { const os = t.objectStore(store); list.forEach(o => os.put(o)); }); },
  del(store, key) { if (DB.memory) return Promise.resolve(); return DB._tx([store], 'readwrite', t => { t.objectStore(store).delete(key); }); },
  /** Atomically replace the entire database (used by restore and reset). */
  replaceAll(data) {
    if (DB.memory) return Promise.resolve();
    return DB._tx(Object.keys(STORES), 'readwrite', (t) => {
      for (const s of Object.keys(STORES)) {
        const os = t.objectStore(s); os.clear();
        (data[s] || []).forEach(o => os.put(o));
      }
    });
  },
};

/* ------------------------------- state ------------------------------- */
const S = {
  accounts: [], categories: [], transactions: [], budgets: [], recurring: [], goals: [],
  loans: [], assets: [], valuations: [], closes: [], settings: {},
};
function settingsToRecords() { return Object.entries(S.settings).map(([key, value]) => ({ key, value })); }

const Store = {
  async load() {
    const data = await DB.loadAll();
    for (const k of Object.keys(STORES)) {
      if (k === 'settings') { S.settings = {}; (data.settings || []).forEach(r => { S.settings[r.key] = r.value; }); }
      else S[k] = data[k] || [];
    }
    if (!S.categories.length) await Seed.run();
    await Store.migrate();
  },
  async migrate() {
    // Data-level migrations keyed on schemaVersion (none yet beyond v1).
    if (!S.settings.schemaVersion) await Store.setSetting('schemaVersion', SCHEMA_VERSION);
  },
  async save(store, obj) {
    const key = STORES[store];
    const list = S[store];
    const i = list.findIndex(x => x[key] === obj[key]);
    if (i >= 0) list[i] = obj; else list.push(obj);
    await DB.put(store, obj);
    Store.changed();
  },
  async saveMany(store, objs) {
    const key = STORES[store];
    for (const obj of objs) { const i = S[store].findIndex(x => x[key] === obj[key]); if (i >= 0) S[store][i] = obj; else S[store].push(obj); }
    await DB.putMany(store, objs);
    Store.changed();
  },
  async remove(store, keyVal) {
    const key = STORES[store];
    S[store] = S[store].filter(x => x[key] !== keyVal);
    await DB.del(store, keyVal);
    Store.changed();
  },
  async setSetting(key, value) {
    S.settings[key] = value;
    await DB.put('settings', { key, value });
  },
  snapshot() {
    const out = {};
    for (const k of Object.keys(STORES)) out[k] = k === 'settings' ? settingsToRecords() : JSON.parse(JSON.stringify(S[k]));
    return out;
  },
  async replaceAll(data) {
    await DB.replaceAll(data);
    for (const k of Object.keys(STORES)) {
      if (k === 'settings') { S.settings = {}; (data.settings || []).forEach(r => { S.settings[r.key] = r.value; }); }
      else S[k] = data[k] || [];
    }
    Store.changed();
  },
  listeners: [],
  changed() { Calc.clearCache(); Store.listeners.forEach(f => f()); },
};

/* ------------------------------- seed ------------------------------- */
const Seed = {
  expense: [
    ['Housing', ['Rent', 'Electricity', 'Water', 'Maintenance', 'Security', 'Household utilities']],
    ['Food and Groceries', ['Supermarket', 'Market purchases', 'Restaurants', 'Takeaways', 'Household consumables']],
    ['Transport', ['Fuel', 'Vehicle maintenance', 'Vehicle insurance', 'Public transport', 'Parking', 'Other transport costs']],
    ['Family and Children', ['School fees', 'Childcare', 'Clothing', 'Medical expenses', 'Family support', 'Entertainment']],
    ['Personal Expenses', ['Clothing', 'Grooming', 'Personal shopping', 'Recreation', 'Subscriptions']],
    ['Healthcare', ['Consultations', 'Medication', 'Medical insurance', 'Laboratory investigations', 'Other healthcare expenses']],
    ['Education and Professional Development', ['Tuition', 'MBA expenses', 'Books', 'Training', 'Academic materials', 'Professional subscriptions']],
    ['Financial Obligations', ['Loan repayments', 'Insurance premiums', 'Pension contributions', 'Interest payments', 'Other financial commitments']],
    ['Other Expenses', ['Gifts', 'Donations', 'Travel', 'Unexpected expenses', 'Miscellaneous']],
  ],
  savings: ['Savings and Investments', ['Emergency fund', 'Bank savings', 'Fixed deposits', 'Investments', 'Business capital', 'Other savings']],
  income: ['Basic salary', 'Housing allowance', 'Bonuses', 'Overtime', 'Business income', 'Consultancy income', 'Investment returns', 'Other income'],
  paymentMethods: ['Cash', 'Bank transfer', 'Airtel Money', 'TNM Mpamba', 'Debit card', 'Cheque', 'Standing order'],
  async run() {
    const cats = []; let order = 0;
    const add = (name, kind, parentId = null, key = null) => { const c = { id: uid(), name, kind, parentId, archived: false, order: order++ }; if (key) c.key = key; cats.push(c); return c; };
    for (const [name, subs] of Seed.expense) {
      const top = add(name, 'expense', null, name === 'Financial Obligations' ? 'finobl' : null);
      subs.forEach(s => add(s, 'expense', top.id, s === 'Interest payments' ? 'interest' : (s === 'Loan repayments' ? 'loanrep' : null)));
    }
    const sv = add(Seed.savings[0], 'savings', null, 'savings');
    Seed.savings[1].forEach(s => add(s, 'savings', sv.id));
    Seed.income.forEach(n => add(n, 'income'));
    S.categories = cats; await DB.putMany('categories', cats);
    const cash = { id: uid(), name: 'Cash', type: 'cash', openingBalance: 0, openingDate: D.today(), archived: false, createdAt: nowIso() };
    S.accounts = [cash]; await DB.put('accounts', cash);
    const defaults = {
      currency: 'MK', currencyCode: 'MWK', dateFormat: 'DD/MM/YYYY', defaultAccountId: cash.id,
      defaultPaymentMethod: '', paymentMethods: Seed.paymentMethods, budgetSuggestMonths: 3,
      createdAt: nowIso(), schemaVersion: SCHEMA_VERSION, autoLockSeconds: 60,
    };
    for (const [k, v] of Object.entries(defaults)) await Store.setSetting(k, v);
  },
};

/* ------------------------- lookups / helpers ------------------------- */
const ACCOUNT_TYPES = {
  cash: { label: 'Cash', spend: true, liquid: true },
  bank: { label: 'Bank (current)', spend: true, liquid: true },
  mobile: { label: 'Mobile money', spend: true, liquid: true },
  savings: { label: 'Savings account', spend: false, liquid: true },
  fixed: { label: 'Fixed deposit', spend: false, liquid: false },
  investment: { label: 'Investment account', spend: false, liquid: false },
};
const TX_TYPES = {
  expense: { label: 'Expense', short: 'Expense', sign: -1 },
  income: { label: 'Income', short: 'Income', sign: 1 },
  transfer: { label: 'Transfer', short: 'Transfer', sign: 0 },
  saving: { label: 'Savings contribution', short: 'Savings', sign: 0 },
  investment: { label: 'Investment contribution', short: 'Investment', sign: 0 },
  loan_repayment: { label: 'Loan repayment', short: 'Loan', sign: -1 },
  loan_in: { label: 'Loan received', short: 'Loan in', sign: 0 },
  adjust: { label: 'Balance adjustment', short: 'Adjust', sign: 0 },
};
const FREQ = { weekly: 'Weekly', monthly: 'Monthly', quarterly: 'Quarterly', annually: 'Annually' };
const perMonth = (amt, freq) => ({ weekly: amt * 52 / 12, monthly: amt, quarterly: amt / 3, annually: amt / 12 }[freq] ?? amt);

const Cat = {
  get: (id) => byId(S.categories, id),
  name(id) { const c = Cat.get(id); return c ? c.name : '(none)'; },
  full(catId, subId) { const c = Cat.get(catId), s = subId ? Cat.get(subId) : null; return c ? (s ? `${c.name} › ${s.name}` : c.name) : 'Uncategorised'; },
  tops(kind, includeArchived = false) { return S.categories.filter(c => c.kind === kind && !c.parentId && (includeArchived || !c.archived)).sort((a, b) => (a.order ?? 0) - (b.order ?? 0)); },
  subs(parentId, includeArchived = false) { return S.categories.filter(c => c.parentId === parentId && (includeArchived || !c.archived)).sort((a, b) => (a.order ?? 0) - (b.order ?? 0)); },
  byKey: (key) => S.categories.find(c => c.key === key),
  inUse(id) {
    return S.transactions.some(t => t.categoryId === id || t.subcategoryId === id)
      || S.budgets.some(b => b.categoryId === id) || S.recurring.some(r => r.categoryId === id || r.subcategoryId === id);
  },
};
const Acct = {
  get: (id) => byId(S.accounts, id),
  name(id) { const a = Acct.get(id); return a ? a.name : '—'; },
  active() { return S.accounts.filter(a => !a.archived); },
  isSpend(a) { return a && ACCOUNT_TYPES[a.type]?.spend; },
};

/* ---------------------------- calculations ---------------------------- */
const Calc = {
  _cache: new Map(),
  clearCache() { Calc._cache.clear(); },
  memo(key, fn) { if (!Calc._cache.has(key)) Calc._cache.set(key, fn()); return Calc._cache.get(key); },

  /** Effect of a transaction on an account balance (tambala). */
  delta(t, accId) {
    let d = 0;
    switch (t.type) {
      case 'income': case 'loan_in': case 'adjust': if (t.accountId === accId) d += t.amount; break;
      case 'expense': case 'loan_repayment': if (t.accountId === accId) d -= t.amount; break;
      case 'transfer': case 'saving': case 'investment':
        if (t.accountId === accId) d -= t.amount;
        if (t.toAccountId === accId) d += t.amount; break;
    }
    return d;
  },
  /** Map accountId -> balance at end of `asOf` (inclusive). Opening balance = balance before recorded transactions. */
  balances(asOf) {
    return Calc.memo('bal|' + asOf, () => {
      const m = new Map(S.accounts.map(a => [a.id, a.openingBalance || 0]));
      for (const t of S.transactions) {
        if (t.date > asOf) continue;
        if (t.accountId && m.has(t.accountId)) m.set(t.accountId, m.get(t.accountId) + Calc.delta(t, t.accountId));
        if (t.toAccountId && t.toAccountId !== t.accountId && m.has(t.toAccountId)) m.set(t.toAccountId, m.get(t.toAccountId) + Calc.delta(t, t.toAccountId));
      }
      return m;
    });
  },
  cashTotal(asOf) { const b = Calc.balances(asOf); return sum(S.accounts.filter(a => Acct.isSpend(a)), a => b.get(a.id) || 0); },

  /** Expense lines a transaction contributes to expenditure analysis. */
  expenseLines(t) {
    if (t.type === 'expense') return [{ cat: t.categoryId, sub: t.subcategoryId || null, amt: t.amount }];
    if (t.type === 'loan_repayment' && t.interest > 0) {
      const fo = Cat.byKey('finobl'), it = Cat.byKey('interest');
      return [{ cat: fo?.id, sub: it?.id || null, amt: t.interest }];
    }
    return [];
  },

  /** Core period summary. from/to inclusive YYYY-MM-DD. */
  summary(from, to) {
    return Calc.memo('sum|' + from + '|' + to, () => {
      const r = {
        from, to, income: 0, expenditure: 0, consumption: 0, interest: 0, savings: 0, investments: 0, principal: 0,
        loanIn: 0, transfers: 0, adjust: 0, txCount: 0,
        byCat: new Map(), bySub: new Map(), incomeByCat: new Map(), savingsBySub: new Map(), payMethods: new Map(),
      };
      const addM = (m, k, v) => m.set(k, (m.get(k) || 0) + v);
      for (const t of S.transactions) {
        if (t.date < from || t.date > to) continue;
        r.txCount++;
        switch (t.type) {
          case 'income': r.income += t.amount; addM(r.incomeByCat, t.categoryId, t.amount); break;
          case 'expense': r.consumption += t.amount; break;
          case 'loan_repayment': r.principal += t.principal || 0; r.interest += t.interest || 0; break;
          case 'saving': r.savings += t.amount; addM(r.savingsBySub, t.subcategoryId || t.categoryId || 'none', t.amount); break;
          case 'investment': r.investments += t.amount; addM(r.savingsBySub, t.subcategoryId || t.categoryId || 'none', t.amount); break;
          case 'loan_in': r.loanIn += t.amount; break;
          case 'transfer': r.transfers += t.amount; break;
          case 'adjust': r.adjust += t.amount; break;
        }
        for (const l of Calc.expenseLines(t)) {
          addM(r.byCat, l.cat, l.amt); if (l.sub) addM(r.bySub, l.sub, l.amt);
          if (t.type === 'expense') addM(r.payMethods, t.paymentMethod || 'Not specified', l.amt);
        }
      }
      r.expenditure = r.consumption + r.interest;
      r.netCashFlow = r.income - r.expenditure;
      r.savingsTotal = r.savings + r.investments;
      r.savingsRate = pct(r.savingsTotal, r.income);
      r.openingCash = Calc.cashTotal(D.addDays(from, -1));
      r.closingCash = Calc.cashTotal(to);
      r.otherMovements = r.closingCash - (r.openingCash + r.income - r.expenditure - r.savings - r.investments - r.principal);
      return r;
    });
  },
  month(ym) { return Calc.summary(D.start(ym), D.end(ym)); },

  /* ------------ budgets ------------ */
  budgetMap(ym) { const m = new Map(); S.budgets.filter(b => b.month === ym).forEach(b => m.set(b.categoryId, b.amount)); return m; },
  status(p) {
    if (p == null) return { key: 'none', label: 'No budget' };
    if (p >= 100) return { key: 'over', label: 'Overspending' };
    if (p >= 90) return { key: 'warn', label: 'Warning' };
    if (p >= 70) return { key: 'near', label: 'Approaching limit' };
    return { key: 'ok', label: 'Normal' };
  },
  /** Budget rows over a month range. Each row: {cat, sub?, allocated, actual, remaining, pct, status} */
  budgetRows(fromYm, toYm) {
    const months = D.monthsInRange(fromYm, toYm);
    const alloc = new Map();
    for (const b of S.budgets) if (b.month >= fromYm && b.month <= toYm) alloc.set(b.categoryId, (alloc.get(b.categoryId) || 0) + b.amount);
    const s = Calc.summary(D.start(fromYm), D.end(toYm));
    const rows = [];
    for (const top of Cat.tops('expense', true)) {
      const subs = Cat.subs(top.id, true);
      const subRows = subs.filter(sc => alloc.has(sc.id)).map(sc => Calc._row(sc, alloc.get(sc.id), s.bySub.get(sc.id) || 0));
      const topAlloc = alloc.get(top.id);
      const actual = s.byCat.get(top.id) || 0;
      if (topAlloc == null && !subRows.length && (top.archived || !actual)) continue;
      const derived = topAlloc == null && subRows.length ? sum(subRows, r => r.allocated) : null;
      const row = Calc._row(top, topAlloc ?? derived, actual);
      row.derived = derived != null; row.subs = subRows; row.hasBudget = topAlloc != null || subRows.length > 0;
      rows.push(row);
    }
    // Totals: top-level budget, else sum of sub budgets (no double counting).
    const budgeted = rows.filter(r => r.hasBudget);
    const totalAlloc = sum(budgeted, r => r.derived ? sum(r.subs, x => x.allocated) : r.allocated);
    const totalActual = sum(budgeted, r => r.derived ? sum(r.subs, x => x.actual) : r.actual);
    const unbudgeted = s.expenditure - totalActual;
    return { rows, totalAlloc, totalActual, remaining: totalAlloc - totalActual, pct: pct(totalActual, totalAlloc), unbudgeted, months: months.length };
  },
  _row(cat, allocated, actual) {
    const p = allocated > 0 ? (actual / allocated) * 100 : (allocated === 0 && actual > 0 ? 100 : (allocated === 0 ? 0 : null));
    return { cat, allocated: allocated ?? null, actual, remaining: allocated != null ? allocated - actual : null, pct: allocated != null ? p : null, status: Calc.status(allocated != null ? p : null) };
  },
  /** Suggested budget: average of previous N months' actual, rounded to nearest MK 1,000. */
  suggestion(catId, ym, isSub) {
    const n = S.settings.budgetSuggestMonths || 3; let total = 0;
    for (let i = 1; i <= n; i++) { const s = Calc.month(D.addMonths(ym, -i)); total += (isSub ? s.bySub.get(catId) : s.byCat.get(catId)) || 0; }
    const avg = total / n;
    return Math.round(avg / 100000) * 100000;
  },

  /* ------------ loans / goals / assets / net worth ------------ */
  loanPrincipalPaid(loan, asOf = '9999-12-31') { return sum(S.transactions.filter(t => t.type === 'loan_repayment' && t.loanId === loan.id && t.date <= asOf), t => t.principal || 0); },
  loanInterestPaid(loan, from = '0000-01-01', to = '9999-12-31') { return sum(S.transactions.filter(t => t.type === 'loan_repayment' && t.loanId === loan.id && t.date >= from && t.date <= to), t => t.interest || 0); },
  loanOutstanding(loan, asOf = '9999-12-31') {
    if (asOf < (loan.startDate || '0000')) return 0;
    return Math.max(0, (loan.balance || 0) - Calc.loanPrincipalPaid(loan, asOf));
  },
  liabilities(asOf = '9999-12-31') { return sum(S.loans, l => Calc.loanOutstanding(l, asOf)); },
  monthlyDebtObligation() { return Math.round(sum(S.loans.filter(l => !l.archived && Calc.loanOutstanding(l) > 0), l => perMonth(l.repayment || 0, l.frequency || 'monthly'))); },
  goalSaved(g, asOf = '9999-12-31') { return (g.startingAmount || 0) + sum(S.transactions.filter(t => (t.type === 'saving' || t.type === 'investment') && t.goalId === g.id && t.date <= asOf), t => t.amount); },
  goalContrib(g, from, to) { return sum(S.transactions.filter(t => (t.type === 'saving' || t.type === 'investment') && t.goalId === g.id && t.date >= from && t.date <= to), t => t.amount); },
  assetValue(asset, asOf = '9999-12-31') {
    const v = S.valuations.filter(x => x.assetId === asset.id && x.date <= asOf).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (a.createdAt < b.createdAt ? 1 : -1))[0];
    return v ? v.value : 0;
  },
  netWorth(asOf) {
    return Calc.memo('nw|' + asOf, () => {
      const bal = Calc.balances(asOf);
      const accounts = S.accounts.filter(a => (a.openingDate || '0000') <= asOf || bal.get(a.id)).map(a => ({ a, value: bal.get(a.id) || 0, liquid: ACCOUNT_TYPES[a.type]?.liquid }));
      const assets = S.assets.map(x => ({ x, value: Calc.assetValue(x, asOf), liquid: !!x.liquid })).filter(r => r.value || !r.x.archived);
      const loans = S.loans.map(l => ({ l, value: Calc.loanOutstanding(l, asOf) })).filter(r => r.value || !r.l.archived);
      const liquid = sum(accounts.filter(r => r.liquid), r => r.value) + sum(assets.filter(r => r.liquid), r => r.value);
      const nonLiquid = sum(accounts.filter(r => !r.liquid), r => r.value) + sum(assets.filter(r => !r.liquid), r => r.value);
      const liab = sum(loans, r => r.value);
      return { accounts, assets, loans, liquid, nonLiquid, totalAssets: liquid + nonLiquid, liabilities: liab, netWorth: liquid + nonLiquid - liab };
    });
  },
  firstDataMonth() {
    let m = S.settings.createdAt ? D.today().slice(0, 7) : D.thisMonth();
    for (const t of S.transactions) if (t.date.slice(0, 7) < m) m = t.date.slice(0, 7);
    for (const a of S.accounts) if (a.openingDate && a.openingDate.slice(0, 7) < m) m = a.openingDate.slice(0, 7);
    for (const v of S.valuations) if (v.date.slice(0, 7) < m) m = v.date.slice(0, 7);
    return m;
  },

  /* ------------ monthly closing statement ------------ */
  closing(ym) {
    const s = Calc.month(ym);
    const b = Calc.budgetRows(ym, ym);
    return {
      month: ym, opening: s.openingCash, income: s.income, expenditure: s.expenditure, savings: s.savings,
      investments: s.investments, principal: s.principal, interest: s.interest, closing: s.closingCash,
      other: s.otherMovements, budgetAlloc: b.totalAlloc, budgetActual: b.totalActual, budgetPct: b.pct,
      overCount: b.rows.filter(r => r.status.key === 'over').length + sum(b.rows, r => r.subs.filter(x => x.status.key === 'over').length),
      liabilities: Calc.liabilities(D.end(ym)), monthlyDebt: Calc.monthlyDebtObligation(),
      upcoming: Recurring.dueBetween(D.addDays(D.end(ym), 1), D.end(D.addMonths(ym, 1))),
    };
  },
};

/* ---------------------------- recurring ---------------------------- */
const Recurring = {
  /** Occurrences (not transactions!) due between two dates, for active items. */
  dueBetween(from, to) {
    const out = [];
    for (const r of S.recurring.filter(x => x.active !== false)) {
      let d = r.nextDue, guard = 0;
      while (d && d <= to && guard++ < 60) { if (d >= from) out.push({ r, date: d }); d = D.next(d, r.frequency, r.anchorDay); }
    }
    return out.sort((a, b) => a.date.localeCompare(b.date));
  },
  upcoming(days = 14) {
    const t = D.today(), end = D.addDays(t, days);
    return S.recurring.filter(x => x.active !== false && x.nextDue && x.nextDue <= end)
      .map(r => ({ r, date: r.nextDue, overdue: r.nextDue < t })).sort((a, b) => a.date.localeCompare(b.date));
  },
  async advance(r) { await Store.save('recurring', { ...r, nextDue: D.next(r.nextDue, r.frequency, r.anchorDay), updatedAt: nowIso() }); },
};

/* ----------------------------- insights ----------------------------- */
const Insights = {
  /** Rules-based. Every figure comes from stored records. */
  forMonth(ym) {
    const out = [];
    const s = Calc.month(ym), p = Calc.month(D.addMonths(ym, -1));
    const name = (id) => Cat.name(id);
    if (!s.txCount) return [{ level: 'info', text: `No transactions recorded for ${D.monthLabel(ym)} yet.` }];

    if (s.income === 0) out.push({ level: 'info', text: `No income recorded for ${D.monthLabel(ym)} yet.` });
    if (s.income > 0 && s.netCashFlow < 0) out.push({ level: 'bad', text: `Cash flow deficit: expenditure exceeded income by ${Money.fmt(-s.netCashFlow)} this month.` });

    // Largest category share
    const cats = [...s.byCat.entries()].filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
    if (cats.length && s.expenditure > 0) {
      const [id, v] = cats[0];
      out.push({ level: 'info', text: `${name(id)} accounts for ${fmtPct(v / s.expenditure * 100)} of your monthly expenditure (${Money.fmt(v)}).` });
    }
    // Overspending this month
    const b = Calc.budgetRows(ym, ym);
    const overs = [];
    for (const r of b.rows) { if (!r.derived && r.allocated != null && r.actual > r.allocated) overs.push(r); r.subs.forEach(x => { if (x.actual > x.allocated) overs.push(x); }); }
    overs.sort((a, b2) => (b2.actual - b2.allocated) - (a.actual - a.allocated)).slice(0, 3)
      .forEach(r => out.push({ level: 'bad', text: `You exceeded your ${r.cat.name.toLowerCase()} budget by ${Money.fmt(r.actual - r.allocated)}.` }));
    const nears = [];
    for (const r of b.rows) { if (!r.derived && r.pct != null && r.pct >= 90 && r.pct < 100) nears.push(r); r.subs.forEach(x => { if (x.pct >= 90 && x.pct < 100) nears.push(x); }); }
    nears.slice(0, 2).forEach(r => out.push({ level: 'warn', text: `${r.cat.name} budget is ${fmtPct(r.pct)} used — ${Money.fmt(r.remaining)} left.` }));

    // Repeated overspending (≥2 of last 3 months)
    const overCount = new Map();
    for (let i = 0; i < 3; i++) {
      const m = D.addMonths(ym, -i), br = Calc.budgetRows(m, m);
      for (const r of br.rows) { if (!r.derived && r.allocated != null && r.actual > r.allocated) overCount.set(r.cat.id, (overCount.get(r.cat.id) || 0) + 1); r.subs.forEach(x => { if (x.actual > x.allocated) overCount.set(x.cat.id, (overCount.get(x.cat.id) || 0) + 1); }); }
    }
    [...overCount.entries()].filter(([, c]) => c >= 2).slice(0, 3)
      .forEach(([id, c]) => out.push({ level: 'warn', text: `Repeated overspending: ${name(id)} has exceeded its budget in ${c} of the last 3 months.` }));

    // Month-on-month increases
    const inc = [];
    for (const [id, v] of s.byCat) {
      const prev = p.byCat.get(id) || 0;
      if (prev > 0 && v > prev) { const ch = (v - prev) / prev * 100; if (ch >= 15 && v - prev >= 1000000) inc.push({ id, ch, v, prev }); }
    }
    inc.sort((a, b2) => (b2.v - b2.prev) - (a.v - a.prev)).slice(0, 3)
      .forEach(x => out.push({ level: 'warn', text: `${name(x.id)} expenditure increased by ${fmtPct(x.ch)} compared with the previous month (${Money.fmt(x.prev)} → ${Money.fmt(x.v)}).` }));
    const dec = [];
    for (const [id, prev] of p.byCat) { const v = s.byCat.get(id) || 0; if (prev >= 2000000 && v < prev && (prev - v) / prev >= 0.2 && D.end(ym) <= D.today()) dec.push({ id, ch: (prev - v) / prev * 100 }); }
    dec.sort((a, b2) => b2.ch - a.ch).slice(0, 1).forEach(x => out.push({ level: 'good', text: `${name(x.id)} expenditure fell by ${fmtPct(x.ch)} compared with the previous month.` }));

    // 3-month rising trend
    const p2 = Calc.month(D.addMonths(ym, -2));
    const rising = [];
    for (const [id, v] of s.byCat) { const a = p2.byCat.get(id) || 0, b1 = p.byCat.get(id) || 0; if (a > 0 && b1 > a && v > b1) rising.push(id); }
    rising.slice(0, 2).forEach(id => out.push({ level: 'warn', text: `${name(id)} spending has risen for 3 consecutive months (${Money.fmt(p2.byCat.get(id))} → ${Money.fmt(p.byCat.get(id))} → ${Money.fmt(s.byCat.get(id))}).` }));

    // Savings rate
    if (s.income > 0) {
      let t = `Your savings rate this month is ${fmtPct(s.savingsRate)} (${Money.fmt(s.savingsTotal)} saved or invested from ${Money.fmt(s.income)} income).`;
      if (p.income > 0) { const d = s.savingsRate - p.savingsRate; if (Math.abs(d) >= 1) t += ` That is ${Math.abs(Math.round(d))} percentage points ${d > 0 ? 'higher' : 'lower'} than last month.`; }
      out.push({ level: s.savingsRate >= 10 ? 'good' : 'info', text: t });
    }

    // Unusual transactions: ≥3× the median of the same subcategory over previous 6 months (min 3 samples, ≥ MK 20,000)
    const from6 = D.start(D.addMonths(ym, -6)), toPrev = D.addDays(D.start(ym), -1);
    const hist = new Map();
    for (const t of S.transactions) if (t.type === 'expense' && t.date >= from6 && t.date <= toPrev) { const k = t.subcategoryId || t.categoryId; if (!hist.has(k)) hist.set(k, []); hist.get(k).push(t.amount); }
    const unusual = [];
    for (const t of S.transactions) {
      if (t.type !== 'expense' || D.ym(t.date) !== ym || t.amount < 2000000) continue;
      const h = hist.get(t.subcategoryId || t.categoryId); if (!h || h.length < 3) continue;
      const sorted = [...h].sort((a, b2) => a - b2), med = sorted[Math.floor(sorted.length / 2)];
      if (med > 0 && t.amount >= 3 * med) unusual.push({ t, x: t.amount / med });
    }
    unusual.sort((a, b2) => b2.x - a.x).slice(0, 3).forEach(({ t, x }) => out.push({ level: 'warn', text: `Unusual transaction: ${Money.fmt(t.amount)} for “${t.description}” (${Cat.full(t.categoryId, t.subcategoryId)}) on ${D.fmt(t.date)} is about ${Math.round(x)}× your typical amount for this item.` }));

    // Savings contribution change
    if (p.savingsTotal > 0 || s.savingsTotal > 0) {
      const diff = s.savingsTotal - p.savingsTotal;
      if (p.savingsTotal > 0 && Math.abs(diff) >= 1000000) out.push({ level: diff > 0 ? 'good' : 'info', text: `Savings and investment contributions ${diff > 0 ? 'increased' : 'decreased'} by ${Money.fmt(Math.abs(diff))} compared with last month.` });
    }
    // Consecutive deficits
    let deficits = 0; for (let i = 0; i < 6; i++) { const m = Calc.month(D.addMonths(ym, -i)); if (m.income > 0 && m.netCashFlow < 0) deficits++; else break; }
    if (deficits >= 2) out.push({ level: 'bad', text: `You have had a cash flow deficit for ${deficits} consecutive months.` });
    return out;
  },
};

'use strict';
/* charts.js — lightweight offline SVG/HTML charts. Tap any mark for its value. */
const Charts = {
  nice(max) {
    if (max <= 0) return 100;
    const p = Math.pow(10, Math.floor(Math.log10(max))), n = max / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  },
  empty(msg = 'No data for this period yet') { return `<div class="chart-empty">${esc(msg)}</div>`; },
  legend(series) {
    if (series.length < 2) return '';
    return `<div class="legend">${series.map(s => `<span><i class="sw ${s.cls}"></i>${esc(s.name)}</span>`).join('')}</div>`;
  },
  /** Grouped vertical bars. series: [{name, cls, values[]}] in tambala. */
  bars(labels, series, opt = {}) {
    const all = series.flatMap(s => s.values);
    if (!all.some(v => v)) return Charts.empty(opt.empty);
    const W = 340, H = opt.height || 170, L = 40, B = 22, T = 8, R = 4;
    const minV = Math.min(0, ...all), maxV = Math.max(0, ...all);
    const top = Charts.nice(maxV), bot = minV < 0 ? -Charts.nice(-minV) : 0;
    const y = v => T + (top - v) / (top - bot) * (H - T - B);
    const n = labels.length, gw = (W - L - R) / n, bw = Math.max(3, Math.min(18, (gw - 6) / series.length - 2));
    let g = '';
    const ticks = bot < 0 ? [top, 0, bot] : [top, top / 2, 0];
    ticks.forEach(t => { g += `<line class="grid${t === 0 ? ' zero' : ''}" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${L - 5}" y="${y(t) + 3}" text-anchor="end">${Money.short(t)}</text>`; });
    labels.forEach((lab, i) => {
      const cx = L + gw * i + gw / 2, start = cx - (series.length * (bw + 2) - 2) / 2;
      series.forEach((s, j) => {
        const v = s.values[i] || 0; if (!v) return;
        const x = start + j * (bw + 2), y0 = y(0), y1 = y(v), h = Math.max(1, Math.abs(y0 - y1));
        const cls = opt.signed ? (v < 0 ? 'neg' : 'pos') : s.cls;
        const r = Math.min(3, bw / 2, h);
        const d = v >= 0
          ? `M${x},${y0}V${y1 + r}q0,-${r} ${r},-${r}h${bw - 2 * r}q${r},0 ${r},${r}V${y0}Z`
          : `M${x},${y0}V${y1 - r}q0,${r} ${r},${r}h${bw - 2 * r}q${r},0 ${r},-${r}V${y0}Z`;
        g += `<path class="mark ${cls}" d="${d}" data-tip="${esc(`${opt.tipLabels ? opt.tipLabels[i] : lab} · ${s.name}: ${Money.fmt(v)}`)}"/>`;
      });
      g += `<rect class="hit" x="${L + gw * i}" y="${T}" width="${gw}" height="${H - T - B}" data-tip="${esc((opt.tipLabels ? opt.tipLabels[i] : lab) + ' — ' + series.map(s => `${s.name}: ${Money.fmt(s.values[i] || 0)}`).join(' · '))}"/>`;
      if (n <= 12) g += `<text class="ax" x="${cx}" y="${H - 7}" text-anchor="middle">${esc(lab)}</text>`;
    });
    return `${Charts.legend(series)}<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.title || 'chart')}">${g}</svg>`;
  },
  /** Line chart. series: [{name, cls, values[]}] */
  line(labels, series, opt = {}) {
    const all = series.flatMap(s => s.values);
    if (!all.some(v => v)) return Charts.empty(opt.empty);
    const W = 340, H = opt.height || 170, L = 40, B = 22, T = 10, R = 8;
    const minV = Math.min(0, ...all), maxV = Math.max(0, ...all);
    const top = Charts.nice(maxV), bot = minV < 0 ? -Charts.nice(-minV) : 0;
    const n = labels.length;
    const x = i => n === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (n - 1);
    const y = v => T + (top - v) / (top - bot) * (H - T - B);
    let g = '';
    const ticks = bot < 0 ? [top, 0, bot] : [top, top / 2, 0];
    ticks.forEach(t => { g += `<line class="grid${t === 0 ? ' zero' : ''}" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${L - 5}" y="${y(t) + 3}" text-anchor="end">${Money.short(t)}</text>`; });
    const step = n > 8 ? 2 : 1;
    labels.forEach((lab, i) => { if (i % step === 0 || i === n - 1) g += `<text class="ax" x="${x(i)}" y="${H - 7}" text-anchor="middle">${esc(lab)}</text>`; });
    series.forEach(s => {
      const pts = s.values.map((v, i) => `${x(i).toFixed(1)},${y(v || 0).toFixed(1)}`);
      if (opt.area && series.length === 1) g += `<path class="area ${s.cls}" d="M${x(0)},${y(0)}L${pts.join('L')}L${x(n - 1)},${y(0)}Z"/>`;
      g += `<polyline class="ln ${s.cls}" points="${pts.join(' ')}"/>`;
      s.values.forEach((v, i) => { g += `<circle class="dot ${s.cls}" cx="${x(i)}" cy="${y(v || 0)}" r="3.5"/>`; });
    });
    labels.forEach((lab, i) => {
      const w = n === 1 ? W - L - R : (W - L - R) / (n - 1);
      g += `<rect class="hit" x="${x(i) - w / 2}" y="${T}" width="${w}" height="${H - T - B}" data-tip="${esc((opt.tipLabels ? opt.tipLabels[i] : lab) + ' — ' + series.map(s => `${s.name}: ${Money.fmt(s.values[i] || 0)}`).join(' · '))}"/>`;
    });
    return `${Charts.legend(series)}<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.title || 'chart')}">${g}</svg>`;
  },
  /** Horizontal share bars (HTML) — items [{label, value}] */
  share(items, total, opt = {}) {
    items = items.filter(i => i.value > 0).sort((a, b) => b.value - a.value);
    if (!items.length) return Charts.empty(opt.empty);
    const max = items[0].value, limit = opt.limit || 8;
    let shown = items.slice(0, limit);
    if (items.length > limit) shown.push({ label: `Other (${items.length - limit})`, value: sum(items.slice(limit), i => i.value) });
    return `<div class="hbars">${shown.map(i => `
      <div class="hb" data-tip="${esc(`${i.label}: ${Money.fmt(i.value)} (${fmtPct(i.value / total * 100, 1)})`)}">
        <div class="hb-top"><span class="hb-l">${esc(i.label)}</span><span class="hb-v">${Money.fmt(i.value)} <small>${fmtPct(i.value / total * 100)}</small></span></div>
        <div class="hb-track"><div class="hb-fill" style="width:${Math.max(1, i.value / max * 100)}%"></div></div>
      </div>`).join('')}</div>`;
  },
  /** Budget vs actual (HTML) — rows from Calc.budgetRows */
  budgetVsActual(rows) {
    rows = rows.filter(r => r.hasBudget);
    if (!rows.length) return Charts.empty('No budgets set for this period');
    const max = Math.max(...rows.map(r => Math.max(r.allocated || 0, r.actual)));
    return `<div class="legend"><span><i class="sw s-budget"></i>Budget</span><span><i class="sw s2"></i>Actual</span></div><div class="bva">${rows.map(r => `
      <div class="bva-row" data-tip="${esc(`${r.cat.name}: actual ${Money.fmt(r.actual)} of ${Money.fmt(r.allocated)} (${fmtPct(r.pct)})`)}">
        <div class="hb-top"><span class="hb-l">${esc(r.cat.name)}</span><span class="hb-v"><span class="st st-${r.status.key}">${fmtPct(r.pct)}</span></span></div>
        <div class="bva-bar"><div class="b-alloc" style="width:${(r.allocated || 0) / max * 100}%"></div></div>
        <div class="bva-bar"><div class="b-act st-bg-${r.status.key}" style="width:${Math.max(r.actual ? 1 : 0, r.actual / max * 100)}%"></div></div>
      </div>`).join('')}</div>`;
  },
  progress(p, statusKey) {
    const w = Math.max(0, Math.min(100, p || 0));
    return `<div class="prog"><div class="prog-fill st-bg-${statusKey || 'ok'}" style="width:${w}%"></div></div>`;
  },
};

'use strict';
/* security.js — PIN / biometric app lock, encrypted backups, file export */
const B64 = {
  enc(buf) { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); },
  dec(str) { const s = atob(str), b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; },
};
const Crypt = {
  available: !!(self.crypto && crypto.subtle),
  rand(n) { return crypto.getRandomValues(new Uint8Array(n)); },
  async sha256(str) { const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); },
  async deriveKey(password, salt, iterations) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey', 'deriveBits']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async deriveBits(password, salt, iterations) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    return B64.enc(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations }, base, 256));
  },
  async encrypt(text, password) {
    const salt = Crypt.rand(16), iv = Crypt.rand(12), iterations = 250000;
    const key = await Crypt.deriveKey(password, salt, iterations);
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(text));
    return { kdf: { name: 'PBKDF2', hash: 'SHA-256', iterations, salt: B64.enc(salt) }, cipher: { name: 'AES-GCM', iv: B64.enc(iv) }, data: B64.enc(ct) };
  },
  async decrypt(p, password) {
    const key = await Crypt.deriveKey(password, B64.dec(p.kdf.salt), p.kdf.iterations);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: B64.dec(p.cipher.iv) }, key, B64.dec(p.data));
    return new TextDecoder().decode(pt);
  },
};

/* ------------------------------ PIN lock ------------------------------ */
const Lock = {
  locked: false, hiddenAt: 0, fails: 0, until: 0,
  enabled() { return !!S.settings.pin; },
  async setPin(pin) {
    const salt = Crypt.rand(16), iterations = 150000;
    await Store.setSetting('pin', { salt: B64.enc(salt), iterations, hash: await Crypt.deriveBits(pin, salt, iterations) });
  },
  async check(pin) {
    const p = S.settings.pin; if (!p) return true;
    return (await Crypt.deriveBits(pin, B64.dec(p.salt), p.iterations)) === p.hash;
  },
  async removePin() { await Store.setSetting('pin', null); await Store.setSetting('webauthn', null); },
  bioSupported: async () => !!(self.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(() => false)),
  async enableBio() {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: Crypt.rand(32), rp: { name: 'Personal Finance Manager' },
      user: { id: Crypt.rand(16), name: 'owner', displayName: 'Owner' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
      timeout: 60000, attestation: 'none',
    } });
    await Store.setSetting('webauthn', { id: B64.enc(cred.rawId) });
  },
  async bioUnlock() {
    const w = S.settings.webauthn; if (!w) return false;
    try {
      await navigator.credentials.get({ publicKey: { challenge: Crypt.rand(32), allowCredentials: [{ type: 'public-key', id: B64.dec(w.id), transports: ['internal'] }], userVerification: 'required', timeout: 60000 } });
      return true;
    } catch (e) { return false; }
  },
  show() {
    if (!Lock.enabled()) return;
    Lock.locked = true;
    let entry = '';
    const el = document.getElementById('lock');
    const dots = () => `<div class="pin-dots">${[0, 1, 2, 3, 4, 5].map(i => `<i class="${i < entry.length ? 'on' : ''}"></i>`).join('')}</div>`;
    const render = (msg = '') => {
      el.innerHTML = `<div class="lock-inner">
        <div class="lock-logo">${ICON_SVG}</div><h2>Enter PIN</h2>${dots()}
        <p class="lock-msg">${esc(msg)}</p>
        <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('')}
          <button data-k="bio" class="${S.settings.webauthn ? '' : 'invisible'}" aria-label="Fingerprint">${FP_SVG}</button><button data-k="0">0</button><button data-k="del" aria-label="Delete">⌫</button></div>
        <button class="btn-link" data-k="ok">Unlock</button></div>`;
    };
    render(); el.hidden = false; document.body.classList.add('is-locked');
    const tryUnlock = async () => {
      if (Date.now() < Lock.until) return render(`Too many attempts. Wait ${Math.ceil((Lock.until - Date.now()) / 1000)}s.`);
      if (await Lock.check(entry)) { Lock.unlock(); return; }
      Lock.fails++; entry = '';
      if (Lock.fails >= 5) { Lock.until = Date.now() + 30000; Lock.fails = 0; render('Too many attempts. Wait 30 seconds.'); }
      else render('Incorrect PIN');
    };
    el.onclick = async (e) => {
      const k = e.target.closest('[data-k]')?.dataset.k; if (!k) return;
      if (k === 'del') entry = entry.slice(0, -1);
      else if (k === 'ok') return tryUnlock();
      else if (k === 'bio') { if (await Lock.bioUnlock()) return Lock.unlock(); return render('Fingerprint not recognised — use PIN'); }
      else if (entry.length < 6) entry += k;
      render();
      if (entry.length === 6 || (entry.length >= 4 && entry.length === (S.settings.pinLength || 0))) tryUnlock();
    };
    if (S.settings.webauthn) setTimeout(async () => { if (Lock.locked && await Lock.bioUnlock()) Lock.unlock(); }, 300);
  },
  unlock() { Lock.locked = false; Lock.fails = 0; const el = document.getElementById('lock'); el.hidden = true; el.innerHTML = ''; document.body.classList.remove('is-locked'); },
  init() {
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) Lock.hiddenAt = Date.now();
      else if (Lock.enabled() && !Lock.locked && Lock.hiddenAt && Date.now() - Lock.hiddenAt > (S.settings.autoLockSeconds ?? 60) * 1000) Lock.show();
    });
    if (Lock.enabled()) Lock.show();
  },
};

const Files = {
  download(text, filename, mime) {
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  },
  canShare(filename, mime) { try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['x'], filename, { type: mime })] })); } catch (e) { return false; } },
  async share(text, filename, mime) {
    const file = new File([text], filename, { type: mime });
    try { await navigator.share({ files: [file], title: filename }); return true; } catch (e) { return e.name === 'AbortError' ? false : (Files.download(text, filename, mime), true); }
  },
  csv(rows) {
    const q = v => { const s = v == null ? '' : String(v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    return '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n');
  },
  stamp() { const d = new Date(); return D.today() + '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0'); },
};

/* ------------------------------ backup ------------------------------ */
const EXCLUDED_SETTINGS = new Set(['pin', 'webauthn', 'pinLength', 'lastBackupAt', 'lastBackupHash', 'lastBackupFile']);
const Backup = {
  data() {
    const snap = Store.snapshot();
    snap.settings = snap.settings.filter(r => !EXCLUDED_SETTINGS.has(r.key));
    return snap;
  },
  async contentHash() { return Crypt.sha256(JSON.stringify(Backup.data())); },
  counts(d) { const c = {}; for (const k of Object.keys(STORES)) c[k] = (d[k] || []).length; return c; },
  async create(password) {
    const data = Backup.data(), body = JSON.stringify(data), hash = await Crypt.sha256(body);
    const env = {
      kind: 'pfm-backup', format: 1, app: 'Personal Finance Manager', appVersion: APP_VERSION, schemaVersion: SCHEMA_VERSION,
      createdAt: nowIso(), timezone: TZ, counts: Backup.counts(data), sha256: hash, encrypted: !!password,
    };
    if (password) env.payload = await Crypt.encrypt(body, password); else env.data = data;
    const filename = `PFM-backup-${Files.stamp()}${password ? '-encrypted' : ''}.json`;
    return { text: JSON.stringify(env), filename, hash };
  },
  async recordDone(hash, filename) {
    await Store.setSetting('lastBackupAt', nowIso());
    await Store.setSetting('lastBackupHash', hash);
    await Store.setSetting('lastBackupFile', filename);
  },
  /** Parse + decrypt + validate. Throws Error with a readable message. */
  async open(text, password) {
    let env; try { env = JSON.parse(text); } catch (e) { throw new Error('This file is not a valid backup (not JSON).'); }
    if (env.kind !== 'pfm-backup') throw new Error('This file is not a Personal Finance Manager backup.');
    if (env.format > 1) throw new Error('This backup was made by a newer version of the app.');
    let body;
    if (env.encrypted) {
      if (!password) { const e = new Error('PASSWORD_REQUIRED'); e.code = 'pw'; throw e; }
      try { body = await Crypt.decrypt(env.payload, password); } catch (e) { const er = new Error('Wrong password, or the file is damaged.'); er.code = 'badpw'; throw er; }
    } else body = JSON.stringify(env.data);
    const hash = await Crypt.sha256(body);
    if (hash !== env.sha256) throw new Error('Backup integrity check failed — the file has been modified or is damaged.');
    const data = JSON.parse(body);
    const errors = Backup.validate(data);
    if (errors.length) throw new Error('Backup validation failed: ' + errors.slice(0, 3).join('; '));
    return { env, data };
  },
  validate(d) {
    const errs = [];
    for (const k of Object.keys(STORES)) if (!Array.isArray(d[k])) errs.push(`missing table "${k}"`);
    if (errs.length) return errs;
    const ids = new Set();
    for (const t of d.transactions) {
      if (!t.id || ids.has(t.id)) errs.push('duplicate or missing transaction id'); ids.add(t.id);
      if (!TX_TYPES[t.type]) errs.push(`unknown transaction type ${t.type}`);
      if (!D.valid(t.date)) errs.push(`invalid date ${t.date}`);
      if (!Number.isSafeInteger(t.amount)) errs.push(`invalid amount in ${t.id}`);
      if (errs.length > 5) break;
    }
    if (!d.categories.length) errs.push('no categories');
    for (const a of d.accounts) if (!a.id || !ACCOUNT_TYPES[a.type] || !Number.isSafeInteger(a.openingBalance || 0)) { errs.push('invalid account'); break; }
    return errs;
  },
  async restore(data) {
    const keep = settingsToRecords().filter(r => ['pin', 'webauthn', 'pinLength'].includes(r.key));
    const merged = { ...data, settings: [...data.settings.filter(r => !EXCLUDED_SETTINGS.has(r.key)), ...keep] };
    await Store.replaceAll(merged);
    await Store.setSetting('lastRestoreAt', nowIso());
  },
};

/* ------------------------------ layers ------------------------------ */
const Layers = {
  stack: [], _waiters: [],
  push(el, onPop) {
    $('#layers').appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('open')));
    Layers.stack.push({ el, onPop });
    history.pushState({ layer: Layers.stack.length }, '');
  },
  pop() {
    if (!Layers.stack.length) return Promise.resolve();
    return new Promise(res => { Layers._waiters.push(res); history.back(); });
  },
  _popped() {
    const l = Layers.stack.pop();
    if (l) { l.el.classList.remove('open'); setTimeout(() => l.el.remove(), 220); try { l.onPop && l.onPop(); } catch (e) { console.error(e); } }
    const w = Layers._waiters.shift(); if (w) setTimeout(w, 0);
  },
  async closeAll() { while (Layers.stack.length) await Layers.pop(); },
};
window.addEventListener('popstate', () => { if (Layers.stack.length) Layers._popped(); });

const Sheet = {
  /** Opens a bottom sheet. Returns root element. */
  open({ title, body, wide = false, onMount, onClose, cls = '' }) {
    const el = document.createElement('div');
    el.className = 'layer sheet-layer ' + cls;
    el.innerHTML = `<div class="backdrop" data-close></div><section class="sheet${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">

      <div class="sheet-b">${body}</div></section>`;
    el.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) Layers.pop(); });
    Layers.push(el, onClose);
    if (onMount) onMount(el.querySelector('.sheet'));
    return el.querySelector('.sheet');
  },
  close: () => Layers.pop(),
};

const Dialog = {
  show({ title = '', message = '', html = '', buttons = [{ label: 'OK', value: true, primary: true }], input = null }) {
    return new Promise((resolve) => {
      let result; const el = document.createElement('div');
      el.className = 'layer dialog-layer';
      el.innerHTML = `<div class="backdrop" data-v="__cancel"></div><div class="dialog" role="alertdialog" aria-modal="true">
        ${title ? `<h3>${esc(title)}</h3>` : ''}${message ? `<p>${esc(message)}</p>` : ''}${html}
        ${input ? `<input class="dlg-input" type="${input.type || 'text'}" placeholder="${esc(input.placeholder || '')}" autocomplete="off" ${input.inputmode ? `inputmode="${input.inputmode}"` : ''}>` : ''}
        <div class="dlg-btns">${buttons.map((b, i) => `<button data-i="${i}" class="btn ${b.primary ? 'primary' : ''} ${b.danger ? 'danger' : ''}">${esc(b.label)}</button>`).join('')}</div></div>`;
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-i]');
        if (b) { const btn = buttons[+b.dataset.i]; result = input && btn.value !== false && btn.value !== null ? { value: btn.value, text: $('.dlg-input', el).value } : btn.value; Layers.pop(); }
        else if (e.target.closest('[data-v="__cancel"]')) { result = input ? null : false; Layers.pop(); }
      });
      Layers.push(el, () => resolve(result === undefined ? (input ? null : false) : result));
      if (input) setTimeout(() => $('.dlg-input', el)?.focus(), 250);
    });
  },
  confirm(message, { title = 'Please confirm', ok = 'Confirm', cancel = 'Cancel', danger = false } = {}) {
    return Dialog.show({ title, message, buttons: [{ label: cancel, value: false }, { label: ok, value: true, primary: !danger, danger }] });
  },
  alert(message, title = '') { return Dialog.show({ title, message }); },
  async prompt(message, { title = '', type = 'text', placeholder = '', ok = 'OK', inputmode } = {}) {
    const r = await Dialog.show({ title, message, input: { type, placeholder, inputmode }, buttons: [{ label: 'Cancel', value: false }, { label: ok, value: true, primary: true }] });
    return r && r.value ? r.text : null;
  },
};

/* ------------------------------ router ------------------------------ */
const Views = {};
let _renderQueued = false;
function route() {
  const h = (location.hash || '#/home').slice(2);
  const [main, sub] = h.split('/');
  const view = Views[main] ? main : 'home';
  $$('.nav a').forEach(a => a.classList.toggle('active', a.dataset.view === view));
  const root = $('#view');
  try { root.innerHTML = Views[view](sub); } catch (e) { console.error(e); root.innerHTML = `<div class="card error">Something went wrong displaying this screen: ${esc(e.message)}</div>`; }
  document.body.dataset.view = view;
  $('#fab').hidden = !['home', 'tx', 'budgets'].includes(view);
  root.querySelectorAll('[data-mount]').forEach(el => Mounts[el.dataset.mount]?.(el));
}
function rerender() { if (_renderQueued) return; _renderQueued = true; requestAnimationFrame(() => { _renderQueued = false; const y = window.scrollY; route(); window.scrollTo(0, y); }); }
const go = (path) => { location.hash = '#/' + path; };
